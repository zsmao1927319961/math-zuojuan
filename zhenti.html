<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>真题错题本</title>
<link rel="stylesheet" href="style.css">
<style>
  body{background:#f4f6fa;margin:0;font-family:-apple-system,'PingFang SC',sans-serif;color:#20242c}
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
  .paper-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(30,40,60,.06);margin-bottom:14px}
  .paper-name{font-size:17px;font-weight:700}
  .paper-meta{font-size:12px;color:#7a828f;margin-top:4px;line-height:1.7}
  .empty{padding:34px 20px;text-align:center}
  .empty-icon{font-size:44px}
  .empty-title{font-size:17px;font-weight:700;margin:10px 0 6px}
  .empty-tip{font-size:13px;color:#7a828f;line-height:1.9}
  .empty-tip b{color:#2f6bff}
  .plan{background:#f2f5fb;border-radius:12px;padding:12px 16px;font-size:13px;line-height:2;margin-top:16px;text-align:left}
  .back{display:inline-block;margin:12px 14px 0;font-size:14px;color:#2f6bff;text-decoration:none}
</style>
</head>
<body>
<a class="back" href="./index.html">← 返回组卷网</a>
<div class="wrap">
  <div class="paper-card">
    <div class="paper-name">真题错题本</div>
    <div class="paper-meta" id="meta">加载中…</div>
  </div>
  <div class="paper-card">
    <div class="empty">
      <div class="empty-icon">📝</div>
      <div class="empty-title">真题阶段还没开始</div>
      <div class="empty-tip">
        这里预留给 <b>历年真题</b> 的错题记录。<br>
        真题复习启动后，把每套真题的<b>错题拍照或题号</b>发给我，<br>
        我会按 <b>年份 → 套数 → 题号</b> 录入，并附上解析定位，<br>
        和模拟卷错题本一样的用法（错因 + 重做打卡）。
      </div>
      <div class="plan">
        <b>建议的真题刷法（10 月启动）：</b><br>
        ① 2000—2010 年：按章节刷，只记录错题<br>
        ② 2011—2020 年：按套限时模拟（8:30–11:30）<br>
        ③ 2021—2026 年：留作 11—12 月全真模考<br>
        ④ 每套做完当天录入错题本，7 天后重做
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  fetch('data/zhenti_errors.json').then(function(r){ return r.json(); }).then(function(d){
    var lines = [];
    if (d.note) lines.push(d.note);
    if (d.papers && d.papers.length) lines.push('已录入 ' + d.papers.length + ' 套');
    document.getElementById('meta').innerHTML = lines.join('<br>') || '暂无数据';
  }).catch(function(e){
    document.getElementById('meta').textContent = '加载失败：' + e.message;
  });
})();
</script>
</body>
</html>
