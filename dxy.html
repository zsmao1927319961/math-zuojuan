<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#eef1f7;color:#232c3d;font-size:15px;padding-bottom:40px}
.hero{background:linear-gradient(135deg,#2b3a67,#4f74d8);color:#fff;padding:18px 16px 16px;border-radius:0 0 18px 18px}
.hero .row{display:flex;align-items:center;gap:10px}
.hero .back{color:#fff;text-decoration:none;font-size:20px;line-height:1;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.14)}

.tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#fff;color:#5a6478;font-weight:600;font-size:14px;cursor:pointer;border:1px solid #e3e8f4}

.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(35,50,90,.08)}

.chap-h.open .arr{transform:rotate(90deg)}
.chap-h .meta{font-size:12px;color:#8a93a8;font-weight:400}
.kp-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;cursor:pointer;border:1px solid #eef1f8;margin-bottom:8px;background:#fbfcff}
.kp-item:active{background:#eef2ff}
.kp-item .nm{flex:1;font-size:14px}

.badge{font-size:11px;border-radius:8px;padding:2px 8px;background:#eef2ff;color:#4f74d8}

.stem img,.exp img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid #e3e8f4;border-radius:11px;cursor:pointer;font-size:15px;line-height:1.7;background:#fff}
.opt .lab{font-weight:800;color:#4f74d8}
.opt.sel{border-color:#4f74d8;background:#f4f7ff}
.opt.right{border-color:#1d9e6f;background:#e9f7f0}
.opt.right .lab{color:#1d9e6f}
.opt.wrong{border-color:#c0504d;background:#fdf0f0}
.opt.wrong .lab{color:#c0504d}
.opt.dis{pointer-events:none}
.btn{display:block;width:100%;text-align:center;padding:11px 0;border-radius:11px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px}
.btn.blue{background:#4f74d8;color:#fff}
.btn.grey{background:#eef1f7;color:#41506e}
.ansbox,.expbox{margin-top:12px;border-radius:11px;padding:12px;line-height:1.9;font-size:15px;white-space:pre-wrap;word-break:break-word}

.expbox{background:#f6f4ea;border:1px solid #e8e2c8}

.ansbox .h{color:#1d9e6f}.expbox .h{color:#8a6d1a}
.ansbox img,.expbox img{max-width:100%;border-radius:8px;margin:6px 0}
.keys{display:flex;gap:9px;margin-top:14px}
.key{flex:1;text-align:center;padding:10px 0;border-radius:11px;border:1.5px solid #e3e8f4;cursor:pointer;font-weight:700;font-size:14px;background:#fff;color:#5a6478}
.key.on-ok{background:#1d9e6f;border-color:#1d9e6f;color:#fff}
.key.on-mid{background:#c07a10;border-color:#c07a10;color:#fff}
.key.on-no{background:#c0504d;border-color:#c0504d;color:#fff}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{margin-top:0}
.duemsg{margin-top:10px;font-size:12px;color:#8a93a8}
.backrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.backrow .lnk{color:#4f74d8;cursor:pointer;font-size:14px;font-weight:600}
.empty{text-align:center;color:#8a93a8;padding:40px 0}
.review-h{font-size:13px;color:#8a93a8;margin:14px 4px 8px}
.rv-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;border:1px solid #eef1f8}
.rv-item .nm{flex:1;font-size:14px}
.rv-item .due{font-size:11px;border-radius:8px;padding:2px 7px}
.rv-item .due.today{background:#fdecec;color:#c0504d}
.rv-item .due.fut{background:#eef2ff;color:#4f74d8}
.paper-meta{font-size:13px;color:#5a6478;margin-bottom:10px}
.paper-part{font-weight:800;color:#2b3a67;margin:16px 0 8px;font-size:15px}
.pq{display:flex;gap:6px;margin-bottom:16px}
.pq-stem b{color:#4f74d8}
.pq-body{flex:1}
.pq-body .stem{font-size:15px}
.pq-img{max-width:92%;display:block;margin:8px 0;border:1px solid #dfe6f2;border-radius:8px}
#qsearch{width:100%;padding:10px 12px;border:1.5px solid #e3e8f4;border-radius:10px;font-size:14px;outline:none;background:#fbfcff;margin-bottom:4px}
#qsearch:focus{border-color:#4f74d8}
.bkrow{display:flex;gap:8px;margin-top:8px}
.mini{flex:1;padding:8px 0;border-radius:9px;border:1px solid #e3e8f4;background:#fff;color:#41506e;font-size:12.5px;cursor:pointer}
.star{cursor:pointer;font-size:13px;color:#8a93a8}
.star.on{color:#e0a010;font-weight:700}
.starrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
body.dark{background:#12161f;color:#dfe4ee}
body.dark .card{background:#1a202b;box-shadow:0 3px 14px rgba(0,0,0,.35)}
body.dark .kp-item,body.dark .rv-item{background:#202836;border-color:#2a3345}
body.dark .stem,body.dark .ansbox,body.dark .expbox,body.dark .txt,body.dark .leaf-nm{color:#dfe4ee}
body.dark .opts .opt{background:#202836;border-color:#2a3345;color:#dfe4ee}
body.dark .opt.right{background:#123527}
body.dark .opt.wrong{background:#3a1a1a}
body.dark .tab{background:#202836;color:#cfd6e4;border-color:#2a3345}
body.dark .tab.on{background:#4f74d8;color:#fff}
body.dark #qsearch{background:#202836;color:#dfe4ee;border-color:#2a3345}
body.dark .mini{background:#202836;color:#cfd6e4;border-color:#2a3345}
body.dark .ansbox{background:#123527;color:#dfe4ee}
body.dark .expbox{background:#2a2718;color:#dfe4ee}
</style>

<body>
<div class="hero">
  <div class="row"><a class="back" href="index.html">‹</a><h1>题库刷题 · 通信原理299题</h1></div>
  <div class="sub">分类树刷题 · 三键掌握 · 错题复测计划</div>
  <div class="stats">
    <div class="stat"><b id="st-total">-</b><span>总题数</span></div>
    <div class="stat"><b id="st-ok">0</b><span>已掌握</span></div>
    <div class="stat"><b id="st-mid">0</b><span>不熟练</span></div>
    <div class="stat"><b id="st-due">0</b><span>今日待复测</span></div>
  </div>
</div>
<div class="wrap">
  <div class="tabs">
    <div class="tab on" id="tab-catalog" onclick="switchTab('catalog')">目录</div>
    <div class="tab" id="tab-review" onclick="switchTab('review')">复测队列</div>
    <div class="tab" id="tab-paper" onclick="switchTab('paper')">拼卷</div>
    <div class="tab" id="tab-fav" onclick="switchTab('fav')">⭐ 收藏</div>
  </div>
  <div id="view"></div>
</div>
<script>
const LS='dxy_state_v1';
let DB=null, STATE=null, VIEW={tab:'catalog', chap:null, kp:null, qidx:0};
function loadState(){ try{STATE=JSON.parse(localStorage.getItem(LS))||{}}catch(e){STATE={}} }
function saveState(){ localStorage.setItem(LS, JSON.stringify(STATE)); }
function st(qid){ return STATE[qid] || (STATE[qid]={mastery:null, due:null, round:0, last:null}); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(base,n){ const d=new Date(base+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* KaTeX 迟到恢复：脚本未就绪时先露原文并登记，动态补拉，就绪后自动重渲染（防 ReferenceError 崩卡片） */
const KXQ = []; let KXT = 0;
function kxDxy(p, s, disp){
  if (window.katex) { katex.render(disp ? p.slice(2,-2) : p.slice(1,-1), s, {displayMode:disp, throwOnError:false, macros:{'\\frac':'\\dfrac'}}); return; }
  s.textContent = p;
  KXQ.push([s, p, disp]);
  if (KXT) return;
  let tries = 0, ticks = 0;
  KXT = setInterval(() => {
    if (window.katex) {
      clearInterval(KXT); KXT = 0;
      const q = KXQ.splice(0);
      for (const [e2, p2, d2] of q) kxDxy(p2, e2, d2);
      return;
    }
    if (++ticks > 75) { clearInterval(KXT); KXT = 0; return; }
    if (tries < 8) { tries++; const sc = document.createElement('script'); sc.src = 'katex/katex.min.js'; sc.async = true; document.head.appendChild(sc); }
  }, 400);
}
function renderMixed(el, text){
  el.innerHTML='';
  const parts=String(text||'').split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g);
  for(const p of parts){
    if(!p) continue;
    if(p.indexOf('$$')===0){ const s=document.createElement('div'); el.appendChild(s); kxDxy(p, s, true); }
    else if(p.indexOf('$')===0){ const s=document.createElement('span'); el.appendChild(s); kxDxy(p, s, false); }
    else el.appendChild(document.createTextNode(p));
  }
}
function renderImg(el, ref){
  if(!ref) return;
  const im=document.createElement('img'); im.src='data/'+ref; im.loading='lazy'; el.appendChild(im);
}
function switchTab(t){
  VIEW.tab=t;
  document.getElementById('tab-catalog').classList.toggle('on', t==='catalog');
  document.getElementById('tab-review').classList.toggle('on', t==='review');
  document.getElementById('tab-paper').classList.toggle('on', t==='paper');
  document.getElementById('tab-fav').classList.toggle('on', t==='fav');
  if(t==='catalog') viewCatalog();
  else if(t==='paper') viewPaper();
  else if(t==='fav') viewFav();
  else viewReview();
}
function kpStat(kpid){
  let total=0, ok=0, due=0; const td=today();
  for(const q of DB.questions){
    if(q.category_id!==kpid) continue;
    total++;
    const s=STATE[q.question_id];
    if(s && s.mastery==='ok') ok++;
    if(s && s.due && s.mastery!=='ok' && daysBetween(td, s.due)<=0) due++;
  }
  return {total, ok, due};
}
function viewCatalog(){
  VIEW.kp=null;
  const v=document.getElementById('view');
  let h='<div class="card"><input id="qsearch" placeholder="🔍 搜题：关键词 / 题号 / 考点…" value="'+esc(VIEW.kw||'')+'">'
    + '<div class="bkrow"><button class="mini" onclick="exportProgress()">⬇ 导出进度</button>'
    + '<button class="mini" onclick="document.getElementById(\'impfile\').click()">⬆ 导入进度</button>'
    + '<button class="mini" onclick="toggleDark()">🌙 深色</button>'
    + '<input type="file" id="impfile" accept=".json" style="display:none" onchange="importProgress(this)"></div></div>';
  const kw=(VIEW.kw||'').trim().toLowerCase();
  if(kw){
    const hits=DB.questions.filter(q=>{
      const hay=(q.question_id+' '+q.serial_number+' '+(q.kp||'')+' '+(q.chapter_name||'')+' '+(q.stem_md||'')).toLowerCase();
      return hay.indexOf(kw)>=0;
    }).slice(0,30);
    h+='<div class="card"><div class="review-h">搜索命中 '+DB.questions.filter(q=>{
      const hay=(q.question_id+' '+q.serial_number+' '+(q.kp||'')+' '+(q.chapter_name||'')+' '+(q.stem_md||'')).toLowerCase();
      return hay.indexOf(kw)>=0;
    }).length+' 题（显示前 30）</div>';
    if(!hits.length) h+='<div class="empty">无命中</div>';
    for(const q of hits){
      const names=kpName(q.category_id);
      const preview=(q.stem_md||'').replace(/\$[^$]*\$/g,'$…$').replace(/\s+/g,' ').slice(0,52);
      h+='<div class="rv-item" onclick="jumpQ('+q.category_id+',\''+q.question_id+'\')"><span class="nm">'+esc(names.kp)+' · 第'+q.serial_number+'题 · '+esc(preview)+'</span></div>';
    }
    h+='</div>';
    v.innerHTML=h;
    const el=document.getElementById('qsearch');
    el.addEventListener('input', ()=>{ VIEW.kw=el.value; viewCatalogKeepFocus(); });
    el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    refreshStats();
    return;
  }
  for(const chap of DB.categories[0].children){
    const open = VIEW.chap===chap.id;
    h+='<div class="card"><div class="chap-h'+(open?' open':'')+'" onclick="toggleChap('+chap.id+')"><span><span class="arr">▶</span> '+esc(chap.name)+'</span><span class="meta">'+chap.question_count+' 题</span></div>';
    if(open){
      for(const kp of chap.children){
        const stt=kpStat(kp.id);
        h+='<div class="kp-item" onclick="openKp('+chap.id+','+kp.id+',\''+esc(kp.name)+'\')"><span class="nm">'+esc(kp.name)+'</span>'
          + (stt.due?'<span class="due">待复测'+stt.due+'</span>':'')
          + (stt.ok? '<span class="done">已掌握 '+stt.ok+'/'+stt.total+'</span>':'<span class="cnt">'+stt.total+' 题</span>')
          + '</div>';
      }
    }
    h+='</div>';
  }
  v.innerHTML=h;
  refreshStats();
  const el=document.getElementById('qsearch');
  if(el){ el.addEventListener('input', ()=>{ VIEW.kw=el.value; viewCatalogKeepFocus(); });
    if(VIEW.kw){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}
let _rt=null;
function viewCatalogKeepFocus(){ clearTimeout(_rt); _rt=setTimeout(()=>{ const f=document.activeElement&&document.activeElement.id==='qsearch'; const v=VIEW.kw; viewCatalog(); }, 0); }
function toggleDark(){ const d=document.body.classList.toggle('dark'); localStorage.setItem('dxy_dark', d?'1':'0'); }
function exportProgress(){
  const blob=new Blob([JSON.stringify({app:'dxy', date:new Date().toISOString(), state:STATE, paper:loadPaper()}, null, 1)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='dxy进度备份-'+today()+'.json'; a.click();
}
function importProgress(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const j=JSON.parse(rd.result);
      if(!j.state) throw 0;
      STATE=j.state; saveState();
      if(j.paper) savePaper(j.paper);
      alert('导入成功'); switchTab(VIEW.tab);
    }catch(e){ alert('文件格式不对'); } };
  rd.readAsText(f);
}
function toggleChap(id){ VIEW.chap = VIEW.chap===id ? null : id; viewCatalog(); }
function kpName(kpid){
  for(const chap of DB.categories[0].children)
    for(const kp of chap.children)
      if(kp.id===kpid) return {chap:chap.name, kp:kp.name};
  return {chap:'', kp:''};
}
function kpQuestions(kpid){ return DB.questions.filter(q=>q.category_id===kpid); }
function openKp(chapId, kpid, kpname){
  VIEW.chap=chapId; VIEW.kp=kpid;
  const qs=kpQuestions(kpid);
  const s=st(qs[0].question_id);
  let idx=0;
  // 优先: 到期复测 > 未掌握第一题
  const td=today();
  for(let i=0;i<qs.length;i++){
    const s2=st(qs[i].question_id);
    if(s2.due && s2.mastery!=='ok' && daysBetween(td,s2.due)<=0){ idx=i; break; }
    if(s2.mastery && s2.mastery!=='ok'){ idx=i; break; }
  }
  VIEW.qidx=idx;
  viewQuestion();
}
function viewQuestion(){
  const qs=kpQuestions(VIEW.kp);
  const q=qs[VIEW.qidx];
  if(!q){ viewCatalog(); return; }
  const names=kpName(VIEW.kp);
  const s=st(q.question_id);
  const v=document.getElementById('view');
  let h='<div class="card"><div class="backrow"><span class="lnk" onclick="viewCatalog()">‹ 返回目录</span><span class="qno">第 '+q.serial_number+' 题</span><span class="lnk" onclick="viewReview()">复测队列</span></div>';
  const TYP_CN={'single_choice':'选择题','fill':'填空题','essay':'简答题','subjective':'计算题'};
  const typCn=(q.legacy&&q.legacy.type_cn)||TYP_CN[q.question_type]||q.question_type;
  h+='<div class="qtop"><span class="badge">'+esc(names.chap)+'</span><span class="badge">'+esc(names.kp)+'</span>'
    + '<span class="badge src">'+esc(typCn)+'</span>'
    + (q.book_page ? '<span class="badge src">📖 书p'+q.book_page+'</span>' : '')
    + (q.video_p ? '<span class="badge" style="background:#fff0f0;color:#e0556a;cursor:pointer" onclick="window.open(\'https://www.bilibili.com/video/BV1PZ421W7EP/?p='+q.video_p+'\',\'_blank\')">📺 视频解析</span>' : '')
    + (q.source? '<span class="badge src">'+esc(q.source)+'</span>':'') + '</div>';
  h+='<div class="stem" id="stem"></div>';
  const isChoice = q.question_type==='single_choice' && q.options.length;
  if(isChoice){
    h+='<div class="opts" id="opts">';
    const sel=s.sel;
    for(const o of q.options){
      let cls='opt';
      if(sel){
        cls+=' dis';
        if(o.id===q.answer.option_ids[0]) cls+=' right';
        else if(sel===o.id) cls+=' wrong';
      } else if(sel===o.id) cls+=' sel';
      h+='<div class="'+cls+'" onclick="pickOpt(\''+o.id+'\')"><span class="lab">'+o.label+'</span><span>'+esc(o.content_md)+'</span></div>';
    }
    h+='</div>';
  }
  if(!s.ansShown){
    h+='<button class="btn blue" onclick="showAns()">'+(isChoice?'交卷并看答案':'看参考答案')+'</button>';
  }
  if(s.ansShown){
    h+='<div class="ansbox" id="ansbox"><div class="h">参考答案</div></div>';
    const bare=x=>String(x||'').replace(/【[^】]*】/g,'').replace(/^[0-9、.．\s]+/,'').replace(/[\s。；;，,]/g,'').trim();
    const explBare=bare(q.explanation_md);
    const ansBare=bare(q.answer.reference_answer_md);
    const hasRealExpl = (explBare.length>=5 && explBare!==ansBare) || q.asset_refs.some(a=>a.position==='explanation');
    if(hasRealExpl)
      h+='<div class="expbox" id="expbox"><div class="h">解析</div></div>';
  }
  h+='<div class="keys">'
    + '<div class="key '+(s.mastery==='ok'?'on-ok':'')+'" onclick="mark(\''+q.question_id+'\',\'ok\')">👍 掌握</div>'
    + '<div class="key '+(s.mastery==='shaky'?'on-mid':'')+'" onclick="mark(\''+q.question_id+'\',\'shaky\')">✏️ 不熟练</div>'
    + '<div class="key '+(s.mastery==='unknown'?'on-no':'')+'" onclick="mark(\''+q.question_id+'\',\'unknown\')">❌ 不会</div>'
    + '</div>'
    + '<div class="starrow"><span class="star '+(s.fav?'on':'')+'" onclick="toggleFav(\''+q.question_id+'\')">⭐ '+(s.fav?'已收藏':'收藏本题')+'</span>'
    + '<span class="duemsg">进度只存本机，记得在目录页导出备份</span></div>';
  if(s.due && s.mastery!=='ok') h+='<div class="duemsg">🔁 复测计划：'+s.due+'（第 '+s.round+' 轮）</div>';
  const nxKp=dxyNextKp();
  h+='<div class="nav"><button class="btn grey" onclick="prevQ()" '+(VIEW.qidx<=0?'disabled':'')+'>‹ 上一题</button>'
    + '<button class="btn grey" onclick="redoQ()">🔄 重做</button>'
    + '<button class="btn grey" onclick="nextQ()">'+(VIEW.qidx>=qs.length-1?'下一考点 ›':'下一题 ›')+'</button>'
    + (nxKp?'<button class="btn grey" onclick="dxyNextKpGo()" style="border-color:#c9d8ff;color:#2f6bff">⏭ '+esc(nxKp.kp.name)+' ›</button>':'')
    + '</div>';
  h+='</div>';
  v.innerHTML=h;
  renderMixed(document.getElementById('stem'), q.stem_md);
  for(const a of (q.asset_refs||[])) if(a.position==='stem') renderImg(document.getElementById('stem'), a.ref);
  if(document.getElementById('ansbox')){
    renderMixed(document.getElementById('ansbox'), (q.answer.reference_answer_md||'（见解析）'));
    const refA=(q.answer.asset_refs_ok)?null:null;
  }
  if(document.getElementById('expbox')){
    renderMixed(document.getElementById('expbox'), q.explanation_md||'（无文字解析，看解析图）');
    for(const a of (q.asset_refs||[])) if(a.position==='explanation') renderImg(document.getElementById('expbox'), a.ref);
  }
  refreshStats();
}
function showAns(){ const s=st(kpQuestions(VIEW.kp)[VIEW.qidx].question_id); s.ansShown=true; saveState(); viewQuestion(); }
function pickOpt(oid){
  const q=kpQuestions(VIEW.kp)[VIEW.qidx];
  const s=st(q.question_id);
  if(s.sel) return;
  s.sel=oid; s.ansShown=true;
  const right=q.answer.option_ids[0];
  s.lastRight = (oid===right);
  saveState(); viewQuestion();
}
function mark(qid, m){
  const s=st(qid);
  const first = s.mastery!==m;
  s.mastery=m; s.last=today();
  if(m==='ok'){ s.due=null; s.round=0; }
  else {
    if(first || !s.due){ s.round=(s.round||0)+1; }
    const seq = m==='unknown' ? [1,3,7] : [2,5,10];
    s.due = addDays(today(), seq[Math.min((s.round||1)-1, seq.length-1)]);
  }
  saveState(); viewQuestion();
}
function redoQ(){
  const q=kpQuestions(VIEW.kp)[VIEW.qidx];
  const s=st(q.question_id);
  delete s.sel; delete s.ansShown;
  saveState(); viewQuestion();
}
function prevQ(){ if(VIEW.qidx>0){ VIEW.qidx--; viewQuestion(); } }
function nextQ(){ const n=kpQuestions(VIEW.kp).length; if(VIEW.qidx<n-1){ VIEW.qidx++; viewQuestion(); } else { dxyNextKpGo(); } }
function dxyNextKp(){
  const chaps=DB.categories[0].children;
  for(let ci=0;ci<chaps.length;ci++){
    const kps=chaps[ci].children;
    for(let i=0;i<kps.length;i++){
      if(kps[i].id===VIEW.kp){
        if(kps[i+1]) return {chap:chaps[ci],kp:kps[i+1]};
        const nc=chaps[ci+1];
        if(nc&&nc.children.length) return {chap:nc,kp:nc.children[0]};
        return null;
      }
    }
  }
  return null;
}
function dxyToast(msg){
  let t=document.getElementById('dxy-toast');
  if(!t){ t=document.createElement('div'); t.id='dxy-toast';
    t.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(30,40,60,.88);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:99;transition:opacity .3s;opacity:0';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity='0'; }, 2000);
}
function dxyNextKpGo(){
  const nx=dxyNextKp();
  if(!nx){ dxyToast('已是最后一个考点 🎉'); return; }
  openKp(nx.chap.id, nx.kp.id, nx.kp.name);
  window.scrollTo({top:0});
}
/* ---------- 拼卷(仿南邮真题结构, 随机抽题广覆盖考点) ---------- */
const PKEY='dxy_paper_v1';
const PTEMPLATE=[
  {label:'一、单项选择题（每空2分，共30分）', cn:['选择'], n:15},
  {label:'二、判断题（每题2分，共10分）', cn:['判断'], n:5},
  {label:'三、填空题（每空2分，共20分）', cn:['填空'], n:10},
  {label:'四、计算题（10分）· 模拟调制', cn:['计算'], chap:5, n:1},
  {label:'五、计算题（10分）· 数字基带传输', cn:['计算'], chap:6, n:1},
  {label:'六、计算题（10分）· 数字频带传输', cn:['计算'], chap:7, n:1},
  {label:'七、综合题（15分）· 信源编码+TDM+频带设计', cn:['计算'], chap:9, prefer:'综合', n:1},
  {label:'八、计算题（15分）· 最佳接收', cn:['计算'], chap:8, n:1},
  {label:'九、计算题（15分）· 信道编码', cn:['计算'], chap:10, n:1},
  {label:'十、计算题（15分）· 信源编码', cn:['计算'], chap:9, n:1},
];
let warnings_paper=[];
function loadPaper(){ try{ return JSON.parse(localStorage.getItem(PKEY)); }catch(e){ return null; } }
function savePaper(p){ if(p) localStorage.setItem(PKEY, JSON.stringify(p)); else localStorage.removeItem(PKEY); }
function chapOfId(q){ return Math.floor((q.category_id - 10000) / 100); }
function genPaper(){
  warnings_paper=[];
  const used_kp={}, used_id={};
  const groups=[];
  for(const t of PTEMPLATE){
    let cand = DB.questions.filter(q => q.legacy && t.cn.includes(q.legacy.type_cn) && !used_id[q.question_id]
      && (!t.chap || chapOfId(q) === t.chap)
      && (t.cn[0] !== '选择' || (q.question_type === 'single_choice' && q.options && q.options.length)));
    if(t.prefer){
      const pref = cand.filter(q => (q.legacy.kp||'').indexOf(t.prefer) >= 0);
      if(pref.length) cand = pref;
    }
    shuffle(cand);
    let pick = cand.filter(q => !used_kp[q.category_id]);
    if(pick.length < t.n) pick = pick.concat(cand.filter(q => !pick.includes(q)));
    pick = pick.slice(0, t.n);
    if(pick.length < t.n){ warnings_paper.push(t.label); }
    groups.push({label:t.label, ids:pick.map(q=>q.question_id)});
    pick.forEach(q => { used_id[q.question_id]=1; used_kp[q.category_id]=1; });
  }
  const p={created: today(), template:'njupt2023', groups};
  savePaper(p);
  viewPaper();
}
function chapterOf(q){ return q.category_full_path.split(' / ')[1] || ''; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function paperQs(p){ return p.groups.flatMap(g=>g.ids.map(id=>DB.questions.find(q=>q.question_id===id))); }
function viewPaper(){
  const p=loadPaper();
  const v=document.getElementById('view');
  let h='<div class="card"><div class="backrow"><span class="lnk" onclick="viewCatalog()">‹ 返回目录</span></div>';
  if(!p){
    h+='<div class="empty"><div class="big">📄</div>按南邮 2023 真题结构随机拼卷，满分 150 分<br>单选 15 空(30分) + 判断 5 题(10分) + 填空 10 空(20分) + 计算综合 7 大题(90分)<br>大题按章定点抽题：模拟调制/基带/频带/综合/最佳接收/信道编码/信源编码'
      + '<div style="margin-top:16px"><button class="flipbtn" style="width:auto;padding:10px 26px" onclick="genPaper()">🎲 生成试卷</button></div></div>';
  } else {
    let answered=0, right=0, total=0;
    h+='<div class="paper-meta">拼卷时间 '+p.created+' · 共 '+p.groups.reduce((n,g)=>n+g.ids.length,0)+' 题'
      + ' · <span class="lnk" onclick="genPaper()">重新拼卷</span></div>';
    if(warnings_paper.length) h+='<div class="paper-meta" style="color:#e8a33d">⚠ 题量不足的槽位：'+esc(warnings_paper.join('、'))+'</div>';
    for(const g of p.groups){
      h+='<div class="paper-part">'+esc(g.label)+'</div>';
      g.ids.forEach((id,qi)=>{
        const q=DB.questions.find(x=>x.question_id===id); if(!q) return;
        const s=st(id);
        const isC=q.question_type==='single_choice'&&q.options.length;
        const stemImgs=(q.asset_refs||[]).filter(r=>r.type==='image'&&r.position==='stem').map(r=>'<img class="pq-img" loading="lazy" src="data/'+r.ref+'">').join('');
        const ansImgs=(q.asset_refs||[]).filter(r=>r.type==='image'&&r.position==='explanation').map(r=>'<img class="pq-img" loading="lazy" src="data/'+r.ref+'">').join('');
        h+='<div class="pq"><div class="pq-stem"><b>'+(qi+1)+'.</b> '+(q.book_page?'<span style="font-size:.8em;color:#4a6cf7;font-weight:600">📖 书p'+q.book_page+'</span> ':'')+'</div><div class="pq-body">';
        h+='<div class="stem" id="pp-'+id+'"></div>'+stemImgs;
        if(isC){
          h+='<div class="opts">';
          for(const o of q.options){
            let cls='opt';
            if(s.sel){ cls+=' dis'; if(o.id===q.answer.option_ids[0]) cls+=' right'; else if(s.sel===o.id) cls+=' wrong'; }
            else if(s.sel===o.id) cls+=' sel';
            h+='<div class="'+cls+'" onclick="pickPaperOpt(\''+id+'\',\''+o.id+'\')"><span class="lab">'+o.label+'</span><span>'+esc(o.content_md)+'</span></div>';
          }
          h+='</div>';
          total++;
          if(s.sel){ answered++; if(s.sel===q.answer.option_ids[0]) right++; }
          if(s.sel) h+='<div class="ansbox" id="pe-'+id+'"><div class="h">解析</div><div id="pe-ex-'+id+'"></div>'+ansImgs+'</div>';
        } else {
          if(s.ansShown) h+='<div class="ansbox" id="pa-'+id+'"><div class="h">参考答案</div><div id="pa-ans-'+id+'"></div><div id="pa-ex-h-'+id+'" class="h" style="margin-top:10px">解析</div><div id="pa-ex-'+id+'"></div>'+ansImgs+'</div>';
          else h+='<button class="btn blue" onclick="showPaperAns(\''+id+'\')">看参考答案</button>';
        }
        h+='</div></div>';
      });
    }
    h+='<div class="card"><div class="g-nm" style="font-weight:800">📊 本次作答</div><div class="root-meta" style="margin-top:6px">'
      + '选择已答 '+answered+'/'+total+'，答对 <b style="color:#1d9e6f">'+right+'</b> 题'
      + ' · 主观题自评后用三键标记</div>'
      + '<button class="btn grey" style="margin-top:10px" onclick="clearPaper()">丢弃本卷</button></div>';
  }
  v.innerHTML=h;
  const p2=loadPaper();
  if(p2) for(const id of p2.groups.flatMap(g=>g.ids)){
    const q=DB.questions.find(x=>x.question_id===id);
    const el=document.getElementById('pp-'+id);
    if(q&&el) renderMixed(el, q.stem_md);
    const ab=document.getElementById('pa-'+id);
    if(ab){
      renderMixed(document.getElementById('pa-ans-'+id), (q.answer.reference_answer_md||'（见解析）'));
      const ex=document.getElementById('pa-ex-'+id);
      if(ex){ if((q.explanation_md||'').trim()) renderMixed(ex, q.explanation_md); else document.getElementById('pa-ex-h-'+id).remove(); }
    }
    const pe=document.getElementById('pe-ex-'+id);
    if(pe){ if((q.explanation_md||'').trim()) renderMixed(pe, q.explanation_md); else document.getElementById('pe-'+id).remove(); }
  }
  refreshStats();
}
function pickPaperOpt(id, oid){
  const q=DB.questions.find(x=>x.question_id===id);
  const s=st(id);
  if(s.sel) return;
  s.sel=oid; s.ansShown=true;
  savePaper(loadPaper());
  viewPaper();
}
function showPaperAns(id){ const s=st(id); s.ansShown=true; saveState(); viewPaper(); }
function clearPaper(){ savePaper(null); viewPaper(); }
function viewReview(){
  const td=today();
  const rows=[];
  for(const q of DB.questions){
    const s=STATE[q.question_id];
    if(!s || !s.due || s.mastery==='ok') continue;
    const d=daysBetween(td, s.due);
    if(d>3) continue;
    rows.push({q, s, d});
  }
  rows.sort((a,b)=>a.d-b.d);
  const v=document.getElementById('view');
  let h='<div class="card"><div class="backrow"><span class="lnk" onclick="viewCatalog()">‹ 返回目录</span></div>';
  if(!rows.length){ h+='<div class="empty">暂无复测任务，去目录挑一个考点开刷吧</div>'; }
  for(const r of rows.slice(0,60)){
    const names=kpName(r.q.category_id);
    h+='<div class="rv-item" onclick="jumpQ('+r.q.category_id+',\''+r.q.question_id+'\')"><span class="nm">'+esc(names.kp)+' · 第'+r.q.serial_number+'题</span>'
      + '<span class="due '+(r.d<=0?'today':'fut')+'">'+(r.d<=0?'今天到期':'还差'+r.d+'天')+'</span></div>';
  }
  h+='</div>';
  v.innerHTML=h;
}
function jumpQ(kpid, qid){
  VIEW.chap=Math.floor(kpid/100)*100===kpid?kpid:Math.floor(kpid/100);
  VIEW.kp=kpid;
  const qs=kpQuestions(kpid);
  VIEW.qidx=Math.max(0, qs.findIndex(x=>x.question_id===qid));
  viewQuestion();
}
function refreshStats(){
  let ok=0, mid=0, due=0; const td=today();
  for(const q of DB.questions){
    const s=STATE[q.question_id];
    if(!s) continue;
    if(s.mastery==='ok') ok++;
    else if(s.mastery==='shaky') mid++;
    if(s.due && s.mastery!=='ok' && daysBetween(td,s.due)<=0) due++;
  }
  document.getElementById('st-total').textContent=DB.questions.length;
  document.getElementById('st-ok').textContent=ok;
  document.getElementById('st-mid').textContent=mid;
  document.getElementById('st-due').textContent=due;
}
function toggleFav(qid){ const s=st(qid); s.fav=!s.fav; saveState(); if(VIEW.tab==='fav') viewFav(); else viewQuestion(); }
function viewFav(){
  const rows=DB.questions.filter(q=>{ const s=STATE[q.question_id]; return s&&s.fav; });
  const v=document.getElementById('view');
  let h='<div class="card"><div class="backrow"><span class="lnk" onclick="viewCatalog()">‹ 返回目录</span></div>';
  if(!rows.length){ h+='<div class="empty">还没有收藏题——刷题时点 ⭐ 收藏本题</div>'; }
  for(const q of rows){
    const names=kpName(q.category_id);
    const preview=(q.stem_md||'').replace(/\$[^$]*\$/g,'$…$').replace(/\s+/g,' ').slice(0,52);
    h+='<div class="rv-item" onclick="jumpQ('+q.category_id+',\''+q.question_id+'\')"><span class="nm">⭐ '+esc(names.kp)+' · 第'+q.serial_number+'题 · '+esc(preview)+'</span>'
      + '<span class="due fut" onclick="event.stopPropagation();toggleFav(\''+q.question_id+'\')">取消</span></div>';
  }
  h+='</div>';
  v.innerHTML=h;
}
if (localStorage.getItem('dxy_dark') === '1') document.body.classList.add('dark');
fetch('data/tk299_dxy.json').then(r=>r.json()).then(j=>{
  DB=j; loadState(); viewCatalog();
}).catch(e=>{
  document.getElementById('view').innerHTML='<div class="card empty">数据加载失败: '+esc(String(e))+'</div>';
});
</script>
