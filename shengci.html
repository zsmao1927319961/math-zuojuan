<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英语生词本 · 滚动复习</title>
<style>
  :root { --blue:#3b7ce0; --blue-dk:#2f6bd0; --blue-lt:#eef4fd; --blue-bd:#c5d9f5;
          --red:#e02b2b; --green:#0c5c46; --ink:#1f2329; --sub:#8a8f99; --line:#dfe4ee; }
  * { box-sizing:border-box; }
  html,body{overflow-x:hidden}
  body { margin:0; background:#eceef2; color:var(--ink);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
         font-size:16.5px; line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; padding:14px 14px 60px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  h1 { font-size:21px; color:var(--blue-dk); margin:4px 0 0; }
  .back { font-size:13.5px; color:#5a6472; text-decoration:none; flex:0 0 auto; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .chip { background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 13px; font-size:13.5px; color:#3c4657; }
  .chip b { color:var(--red); }
  .tabs { display:flex; gap:8px; margin:12px 0 2px; }
  .tabs button { flex:1; border:1px solid var(--blue-bd); background:var(--blue-lt); border-radius:10px;
                 padding:8px 0; font-size:15px; cursor:pointer; color:var(--blue-dk); font-weight:600; }
  .tabs button.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:12px 0;
          box-shadow:0 2px 10px rgba(35,50,90,.05); }
  .card h2 { font-size:16.5px; margin:0 0 8px; color:var(--blue-dk); border-left:4px solid var(--blue); padding-left:9px; }
  .notice { background:#fff7e8; border:1px solid #f0dfb8; border-radius:10px; padding:10px 13px; font-size:14.5px; margin:10px 0; }
  .notice.blue { background:var(--blue-lt); border-color:var(--blue-bd); }
  .tip { background:#fff7e8; border:1px solid #f0dfb8; border-radius:10px; padding:8px 13px; font-size:14px; margin-top:10px; }
  .foot { text-align:center; color:var(--sub); font-size:12.5px; margin-top:24px; }
  /* —— 录入表单 —— */
  .frm label { font-size:13px; color:#5a6472; font-weight:700; display:block; margin-top:7px; }
  .frm label i { font-style:normal; color:var(--sub); font-weight:400; }
  .frm input { width:100%; border:1px solid var(--blue-bd); border-radius:9px; padding:8px 11px;
               font-size:16px; font-family:inherit; background:#fbfdff; margin-top:2px; }
  .frm input:focus { outline:2px solid #c5d9f5; border-color:var(--blue); }
  .frow { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { border:1.5px solid var(--blue); background:var(--blue); color:#fff; border-radius:9px;
         padding:7px 20px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.ghost { background:#fff; color:var(--blue-dk); }
  .btn.gray { background:#fff; color:var(--sub); border-color:var(--line); }
  .btn.green { background:var(--green); border-color:var(--green); }
  /* —— 词表 —— */
  .search { width:100%; border:1px solid var(--blue-bd); border-radius:9px; padding:8px 11px;
            font-size:15px; background:#fbfdff; font-family:inherit; margin-bottom:6px; }
  .cnt { font-size:12.5px; color:var(--sub); margin:2px 0 6px; }
  .wrow { background:#fbfdff; border:1px solid var(--blue-bd); border-radius:12px; padding:10px 13px; margin:9px 0; }
  .wline { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .word { font-size:17.5px; font-weight:700; word-break:break-word; }
  .ipa { color:var(--blue); font-size:13.5px; }
  .spk { border:none; background:var(--blue-lt); border:1px solid var(--blue-bd); color:var(--blue-dk);
         border-radius:50%; width:26px; height:26px; font-size:13px; cursor:pointer; flex:0 0 auto;
         display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; }
  .st { font-size:11.5px; border-radius:999px; padding:1px 9px; font-weight:700; white-space:nowrap; }
  .st.new { background:#eef1f6; color:#7a8496; }
  .st.mid { background:#fff3e2; color:#b26a00; }
  .st.ok  { background:#e5f3ea; color:var(--green); }
  .mng { font-size:15px; margin-top:2px; }
  .mnn { font-size:13px; color:#5a6472; margin-top:2px; background:var(--blue-lt);
         border-radius:8px; padding:3px 9px; display:inline-block; }
  .exx { font-size:13.5px; color:#5a6472; margin-top:5px; padding-left:10px; border-left:3px solid var(--blue-bd); }
  .meta { font-size:12px; color:var(--sub); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .ops { margin-left:auto; display:flex; gap:6px; }
  .op { border:1px solid var(--line); background:#fff; border-radius:7px; padding:2px 9px;
        font-size:12.5px; cursor:pointer; color:#5a6472; font-family:inherit; }
  .op.red { color:var(--red); border-color:#e6b8b5; }
  .empty { text-align:center; color:var(--sub); font-size:14.5px; padding:18px 6px; }
  /* —— 滚动复习卡(仿背单词App新词卡) —— */
  .rv-top { display:flex; justify-content:space-between; font-size:12.5px; color:var(--sub); margin:12px 2px 0; flex-wrap:wrap; gap:6px; }
  .rvcard { background:#fff; border:1px solid var(--line); border-radius:22px; padding:22px 18px 18px;
            margin:10px 0 12px; text-align:center; cursor:pointer; user-select:none;
            box-shadow:0 4px 18px rgba(35,50,90,.08); }
  .rv-tag { display:inline-block; background:var(--blue-lt); color:var(--blue-dk); border:1px solid var(--blue-bd);
            border-radius:999px; padding:2px 14px; font-size:13px; font-weight:700; }
  .rv-wh { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .rvcard .rw { font-size:34px; font-weight:800; color:#2b2f36; word-break:break-word; line-height:1.3; }
  .rvcard .spk { width:34px; height:34px; font-size:16px; }
  .rv-ipa { color:var(--blue); font-size:15.5px; margin-top:4px; word-break:break-word; }
  .rvcard .hint { font-size:13px; color:var(--sub); margin-top:16px; }
  .rv-mean { display:none; font-size:19px; font-weight:600; margin-top:14px; line-height:1.6; }
  .rv-mn { display:none; background:var(--blue-lt); border-radius:12px; padding:8px 13px; margin-top:12px;
           font-size:14px; color:#3c4657; text-align:left; line-height:1.65; }
  .rv-mn b { color:var(--blue-dk); }
  .rv-ex { display:none; margin-top:12px; text-align:left; padding-left:11px; border-left:4px solid var(--blue); }
  .rv-ex .en { font-size:15.5px; color:var(--ink); user-select:text; }
  .rv-ex .zh { font-size:13.5px; color:var(--sub); margin-top:2px; user-select:text; }
  .rvcard.open .rv-mean, .rvcard.open .rv-mn, .rvcard.open .rv-ex { display:block; }
  .rvcard.open .hint { display:none; }
  .rv-btns { display:none; gap:10px; margin-top:20px; }
  .rvcard.open .rv-btns { display:flex; }
  .rv-btns button { flex:1; border-radius:13px; padding:11px 0; font-size:16px; font-weight:700; cursor:pointer;
                    font-family:inherit; background:var(--blue-lt); border:1.5px solid var(--blue-bd); color:var(--blue-dk); }
  .rv-btns .rv-no { color:var(--red); }
  .rv-big { display:block; width:100%; border-radius:13px; padding:13px 0; font-size:17px; font-weight:800;
            background:var(--blue); color:#fff; border:none; cursor:pointer; margin-top:10px; font-family:inherit; }
  .rv-done { text-align:center; padding:26px 8px 10px; }
  .rv-done .big { font-size:40px; }
  .rv-done h2 { font-size:19px; color:var(--green); margin:8px 0 4px; border:none; padding:0; }
  .rv-done .sum { font-size:14.5px; color:#5a6472; line-height:2; }
  @media (max-width:520px){ body{font-size:15.5px} .rvcard .rw{font-size:28px} .word{font-size:16.5px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>英语生词本 · 滚动复习</h1>
    <a class="back" href="index.html">← 返回主站</a>
  </div>
  <div class="chips">
    <span class="chip" id="cd"></span>
    <span class="chip" id="pc"></span>
  </div>
  <div class="tabs">
    <button data-v="list" class="on">词表 · 录入</button>
    <button data-v="review">滚动复习</button>
  </div>
  <div id="app"></div>

  <div class="tip"><b>用法</b>:做阅读遇到不会的词 →【词表 · 录入】记下单词+词义(音标/例句原文/译文/助记可选) →【滚动复习】看单词想词义,点卡片翻面对答案 → <b>✓认识</b>间隔拉长(1/2/4/7/15 天后再见),<b>❌不认识</b>当场滚回队尾,一轮里反复见面直到认识。数据只存本机浏览器,换设备走全站备份页打包。</div>
  <div class="foot">生词本 v2 · 滚动复习 ｜ 数据存本机(shengci_v1) ｜ 只收自己亲手遇到的词,不灌通用词表</div>
</div>

<script>
'use strict';
const LS = 'shengci_v1', EXAM = '2026-12-19';
const IV = [0, 1, 2, 4, 7, 15];          /* 认识后按新等级顺延的天数 */
let DB = { v: 1, words: [] };
let view = 'list', q = null, session = null, editIdx = -1, kw = '';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function addDays(iso, n){ const p = iso.split('-').map(Number); const d = new Date(p[0], p[1] - 1, p[2] + n);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function diffDays(a, b){ const p = x => { const t = x.split('-').map(Number); return new Date(t[0], t[1] - 1, t[2]); };
  return Math.round((p(a) - p(b)) / 86400000); }
function toast(msg){ const t = document.createElement('div'); t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,24,32,.92);color:#fff;border-radius:10px;padding:9px 18px;font-size:13.5px;z-index:99';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function speak(t){ try { const u = new SpeechSynthesisUtterance(String(t).replace(/\/|\s*英|\s*美/g, ' ').trim() || t);
  u.lang = 'en-US'; u.rate = .88; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }

/* —— 存储(解析失败自动封存旧数据,不丢词) —— */
(function load(){
  const raw = localStorage.getItem(LS);
  if (raw){
    try { const d = JSON.parse(raw); if (d && Array.isArray(d.words)) { DB = d; return; } } catch(e){}
    try { localStorage.setItem(LS + '_broken_' + todayISO().replace(/-/g, ''), raw); } catch(e){}
  }
  DB = { v: 1, words: [] };
})();
function save(){ try { localStorage.setItem(LS, JSON.stringify(DB)); return true; }
  catch(e){ toast('保存失败:浏览器存储空间不足'); return false; } }

/* —— 词的等级徽章 —— */
function stTag(x){
  if (x.box >= 5) return '✓ 已掌握';
  if (!x.lr) return '✨ 新词';
  return '🔁 巩固 ' + '●'.repeat(x.box) + '○'.repeat(5 - x.box);
}
function stCls(x){ return x.box >= 5 ? 'ok' : (!x.lr ? 'new' : 'mid'); }

/* —— 录入 / 修改 —— */
function addWord(w, m, ipa, ex, exz, mn){
  w = w.trim(); m = m.trim(); ipa = ipa.trim(); ex = ex.trim(); exz = exz.trim(); mn = mn.trim();
  if (!w || !m) return '单词和词义都要填';
  const nw = w.toLowerCase();
  if (DB.words.some((x, i) => i !== editIdx && x.w.trim().toLowerCase() === nw)) return '「' + w + '」已经在生词本里了';
  if (editIdx >= 0){
    const x = DB.words[editIdx];
    x.w = w; x.m = m;
    if (ipa) x.ipa = ipa; else delete x.ipa;
    if (ex) x.ex = ex; else delete x.ex;
    if (exz) x.exz = exz; else delete x.exz;
    if (mn) x.mn = mn; else delete x.mn;
    editIdx = -1; save(); return '';
  }
  const o = { w, m, t: todayISO(), box: 0, due: todayISO(), ok: 0, nk: 0, lr: '' };
  if (ipa) o.ipa = ipa; if (ex) o.ex = ex; if (exz) o.exz = exz; if (mn) o.mn = mn;
  DB.words.unshift(o);
  save(); return '';
}

/* —— 复习队列:到期才进(✗当天还在,✓按 1/2/4/7/15 天回来);熟度低的先出,最久没碰的先出 —— */
function buildQueue(force){
  const t = todayISO();
  return DB.words.filter(x => force ? x.box < 5 : ((x.due || x.t || t) <= t))
    .sort((a, b) => (a.box - b.box) ||
      ((a.lr || '') < (b.lr || '') ? -1 : (a.lr || '') > (b.lr || '') ? 1 : 0) ||
      ((a.t || '') < (b.t || '') ? -1 : 1));
}
function startReview(force){
  q = buildQueue(force);
  session = { seen: 0, ok: 0, ng: 0 };
  if (!q.length) q = 'done';
  view = 'review'; render(); window.scrollTo(0, 0);
}
function grade(knows){
  const x = q[0];
  if (knows){ x.box = Math.min(x.box + 1, 5); x.due = addDays(todayISO(), IV[x.box]); x.ok++; session.ok++; }
  else { x.box = Math.max(0, x.box - 1); x.due = todayISO(); x.nk++; session.ng++; }
  x.lr = todayISO(); save();
  q = knows ? q.slice(1) : q.slice(1).concat([x]);   /* ✗ 滚回队尾,本轮再见面 */
  session.seen++;
  if (!q.length) q = 'done';
  render();
}

/* —— 词表视图 —— */
function vList(){
  const e0 = editIdx >= 0 ? DB.words[editIdx] : null;
  const v = x => e0 && x ? esc(e0[x]) : '';
  let h = `<div class="card frm">
    <h2>${e0 ? '✎ 修改单词' : '➕ 记生词'}</h2>
    <label>单词 *</label><input id="f-w" type="text" placeholder="如 substantial / look into" value="${v('w')}" autocomplete="off">
    <label>音标 <i>(可选)</i></label><input id="f-i" type="text" placeholder="如 英 /səbˈstænʃl/ 美 /-ˈstæn-/ ,只填一个也行" value="${v('ipa')}" autocomplete="off">
    <label>词义 *</label><input id="f-m" type="text" placeholder="如 adj.大量的;结实的 / 深入调查" value="${v('m')}" autocomplete="off">
    <label>例句原文 <i>(可选,建议填阅读原句)</i></label><input id="f-x" type="text" placeholder="阅读里遇到这个词的那句" value="${v('ex')}" autocomplete="off">
    <label>例句译文 <i>(可选)</i></label><input id="f-z" type="text" placeholder="例句的中文翻译" value="${v('exz')}" autocomplete="off">
    <label>助记 <i>(可选,词根拆解/联想)</i></label><input id="f-n" type="text" placeholder="如 sub-(下)+stan(站)→站在下面→结实的大量" value="${v('mn')}" autocomplete="off">
    <div class="frow">
      <button class="btn" id="f-add">${e0 ? '保存修改' : '➕ 添加'}</button>
      ${e0 ? '<button class="btn gray" id="f-cancel">取消</button>' : ''}
    </div>
  </div>
  <div class="card">
    <h2>我的生词</h2>
    <input class="search" id="kw" type="text" placeholder="搜单词或词义…" value="${esc(kw)}" autocomplete="off">
    <div class="cnt" id="cnt"></div><div id="rows"></div>
  </div>`;
  $('#app').innerHTML = h;

  const rows = kw ? DB.words.map((x, i) => [x, i]).filter(([x]) =>
    (x.w + ' ' + x.m + ' ' + (x.ex || '')).toLowerCase().includes(kw.toLowerCase())) : DB.words.map((x, i) => [x, i]);
  $('#cnt').textContent = kw ? `搜到 ${rows.length} / 共 ${DB.words.length} 词` :
    `共 ${DB.words.length} 词 · 掌握 ${DB.words.filter(x => x.box >= 5).length} · 巩固中 ${DB.words.filter(x => x.box > 0 && x.box < 5).length} · 新词 ${DB.words.filter(x => !x.lr).length}`;
  $('#rows').innerHTML = rows.length ? rows.map(([x, i]) => `<div class="wrow">
      <div class="wline"><span class="word">${esc(x.w)}</span><button class="spk" data-say="${i}" title="朗读">🔊</button><span class="st ${stCls(x)}">${stTag(x)}</span></div>
      ${x.ipa ? `<div class="ipa">${esc(x.ipa)}</div>` : ''}
      <div class="mng">${esc(x.m)}</div>
      ${x.mn ? `<div class="mnn">💡 ${esc(x.mn)}</div>` : ''}
      ${x.ex ? `<div class="exx">${esc(x.ex)}${x.exz ? `<br> ${esc(x.exz)}` : ''}</div>` : ''}
      <div class="meta"><span>✓${x.ok} ✗${x.nk}</span><span>记于 ${(x.t || '').slice(5)}</span>${x.box > 0 ? `<span>下次 ${(x.due || '').slice(5)}</span>` : ''}
        <span class="ops"><button class="op" data-e="${i}">✎ 改</button><button class="op red" data-d="${i}">✕ 删</button></span></div>
    </div>`).join('') : `<div class="empty">${kw ? '没搜到,换个词试试' : '还是空的:把上面第一个不会的单词记进来 📝'}</div>`;

  const doAdd = () => {
    const r = addWord($('#f-w').value, $('#f-m').value, $('#f-i').value, $('#f-x').value, $('#f-z').value, $('#f-n').value);
    if (r){ toast(r); return; }
    toast(editIdx >= 0 ? '已保存' : '已记入生词本');
    render();
    const w = $('#f-w'); if (w) w.focus();
  };
  $('#f-add').addEventListener('click', doAdd);
  const fc = $('#f-cancel'); if (fc) fc.addEventListener('click', () => { editIdx = -1; vList(); });
  ['f-w', 'f-i', 'f-m', 'f-x', 'f-z', 'f-n'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); }));
  $('#kw').addEventListener('input', e => { kw = e.target.value; const pos = e.target.selectionStart; vList();
    const k2 = $('#kw'); k2.focus(); k2.setSelectionRange(pos, pos); });
  $('#app').querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); speak(DB.words[+b.dataset.say].w); }));
  $('#app').querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => {
    editIdx = +b.dataset.e; vList(); window.scrollTo(0, 0); $('#f-w').focus(); }));
  $('#app').querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
    const x = DB.words[+b.dataset.d];
    if (!confirm('删除「' + x.w + '」?(不可恢复)')) return;
    const di = +b.dataset.d;
    DB.words.splice(di, 1);
    if (editIdx === di) editIdx = -1; else if (editIdx > di) editIdx--;
    save(); render();
  }));
}

/* —— 复习视图 —— */
function vReview(){
  let h = '';
  if (!DB.words.length){
    h = '<div class="notice">词表还是空的:先去【词表 · 录入】把阅读里不会的单词记进来。</div>';
  } else if (q === 'done'){
    const left = buildQueue(true).length;
    h = `<div class="card rv-done"><span class="big">🎉</span>
      <h2>本轮滚完</h2>
      <div class="sum">过卡 <b>${session.seen}</b> 次 · 点认识 <b>${session.ok}</b> 次 · 点不认识 <b>${session.ng}</b> 次<br>
      ${left ? `还有 <b>${left}</b> 个词没到「已掌握」,不想等排期就再滚一轮` : '全部已掌握,太强了 💪'}</div>
      <div class="frow" style="justify-content:center;margin-top:14px">
        ${left ? '<button class="btn green" id="rv-again">🔄 再滚一轮(未掌握)</button>' : ''}
        <button class="btn ghost" id="rv-back">← 回词表</button>
      </div></div>`;
  } else if (!q){
    const due = buildQueue(false), unfin = DB.words.filter(x => x.box < 5).length;
    if (due.length){
      h = `<div class="card"><h2>滚动复习</h2>
        <div style="font-size:14.5px;color:#5a6472">今日到期 <b>${due.length}</b> 词${unfin > due.length ? `(全部未掌握共 ${unfin} 词,其余按 1/2/4/7/15 天排期自动到点)` : ''}。<br>流程:看单词想词义(可点🔊听发音) → 点卡片翻面对答案 → 自评。</div>
        <button class="rv-big" id="rv-go">▶ 开始复习(${due.length} 词)</button></div>`;
    } else {
      h = `<div class="notice blue">今天没有到期的词 🎯 刚认识过的会按 1/2/4/7/15 天排期自动回来。</div>
        ${unfin ? `<div class="card"><h2>加练</h2><div style="font-size:14.5px;color:#5a6472">没到排期也想滚?还有 <b>${unfin}</b> 个未掌握词。</div>
        <button class="rv-big" id="rv-force">🔄 全部未掌握滚一轮(${unfin} 词)</button></div>` : ''}`;
    }
  } else {
    const x = q[0];
    h = `<div class="rv-top"><span>剩 <b>${q.length}</b> 张 · 已过 ${session.seen} 次</span><span>${stTag(x)}</span></div>
      <div class="rvcard" id="rv">
        <div class="rv-tag">${stTag(x)}</div>
        <div class="rv-wh"><div class="rw">${esc(x.w)}</div><button class="spk" id="rv-spk" title="朗读">🔊</button></div>
        ${x.ipa ? `<div class="rv-ipa">${esc(x.ipa)}</div>` : ''}
        <div class="hint">👆 点卡片看词义</div>
        <div class="rv-mean">${esc(x.m)}</div>
        ${x.mn ? `<div class="rv-mn"><b>💡 助记:</b>${esc(x.mn)}</div>` : ''}
        ${x.ex ? `<div class="rv-ex"><div class="en">${esc(x.ex)}</div>${x.exz ? `<div class="zh">${esc(x.exz)}</div>` : ''}</div>` : ''}
        <div class="rv-btns">
          <button class="rv-no" id="rv-no">❌ 不认识</button>
          <button class="rv-yes" id="rv-yes">✓ 认识</button>
        </div>
      </div>`;
  }
  $('#app').innerHTML = h;

  const go = $('#rv-go'); if (go) go.addEventListener('click', () => startReview(false));
  const gf = $('#rv-force'); if (gf) gf.addEventListener('click', () => startReview(true));
  const again = $('#rv-again'); if (again) again.addEventListener('click', () => startReview(true));
  const back = $('#rv-back'); if (back) back.addEventListener('click', () => { view = 'list'; q = null; render(); });
  const rv = $('#rv');
  if (rv){
    rv.addEventListener('click', () => rv.classList.add('open'));
    $('#rv-spk').addEventListener('click', e => { e.stopPropagation(); speak(q[0].w); });
    $('#rv-yes').addEventListener('click', e => { e.stopPropagation(); grade(true); });
    $('#rv-no').addEventListener('click', e => { e.stopPropagation(); grade(false); });
  }
}

function render(){
  const t = todayISO();
  $('#cd').innerHTML = `距初试还有 <b>${Math.max(diffDays(EXAM, t), 0)}</b> 天`;
  $('#pc').innerHTML = `共 <b>${DB.words.length}</b> 词 · 已掌握 <b>${DB.words.filter(x => x.box >= 5).length}</b> · 今日待复习 <b>${buildQueue(false).length}</b>`;
  if (view === 'list') vList(); else vReview();
}

document.querySelectorAll('.tabs button').forEach(b =>
  b.addEventListener('click', () => {
    view = b.dataset.v; q = null; session = null;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    render(); window.scrollTo(0, 0);
  }));
render();
</script>
</body>
</html>
