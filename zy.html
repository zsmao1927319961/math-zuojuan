<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专业课每日五题</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<style>
  body{background:#f4f6fa;margin:0;font-family:-apple-system,'PingFang SC',sans-serif;color:#20242c}
  .wrap{max-width:820px;margin:0 auto;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
  .paper-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(30,40,60,.06);margin-bottom:14px}
  .paper-name{font-size:17px;font-weight:700}
  .paper-meta{font-size:12px;color:#7a828f;margin-top:4px}
  .stats{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .stat{background:#f2f5fb;border-radius:10px;padding:7px 12px;font-size:13px}
  .stat b{font-size:16px}
  .stat.ok b{color:#1d9e6f}
  .stat.bad b{color:#d34}
  .qcard{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(30,40,60,.06);margin-bottom:14px;padding:12px 16px}
  .qcard.done{border-left:4px solid #1d9e6f}
  .qcard.wrong{border-left:4px solid #d34}
  .bar{height:8px;background:#e8ecf3;border-radius:4px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1d9e6f,#4cc08a);border-radius:4px;transition:width .3s}
  .ansbox .sec{font-weight:700;margin:8px 0 2px;font-size:13.5px}
  .ansbox .sec.kp{color:#1a6b47}
  .ansbox .sec.step{color:#2f6bff}
  .ansbox .sec.ans{color:#a06b00}
  .ansbox .sec.warn{color:#c33}
  .gate-hint{display:none;margin-top:8px;font-size:12px;color:#a06b00;background:#fff7e8;border:1px solid #f0e0bb;border-radius:8px;padding:6px 10px}
  .gate-hint.show{display:block}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .qno{font-weight:700;font-size:15px}
  .tag{font-size:11px;background:#eef1f6;color:#5a6472;border-radius:6px;padding:2px 7px}
  .tag.ok{background:#e8f7f0;color:#1d9e6f}
  .tag.review{background:#fff4e0;color:#a06b00}
  .tag.bad{background:#fdeaea;color:#d34}
  .qtext{font-size:16px;line-height:2;color:#222;background:#fff;padding:6px 2px;text-align:left;white-space:pre-wrap;overflow-x:auto}
  .ansbox{display:none;margin-top:10px;border-top:1px dashed #d8dce4;padding-top:8px}
  .ansbox.show{display:block}
  .ansbox .at{font-size:12px;color:#a06b00;font-weight:700;margin-bottom:4px}
  .ansbody{font-size:14px;line-height:1.95;color:#333;white-space:pre-wrap}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:1px solid #d6dbe3;background:#f7f8fb;border-radius:9px;padding:6px 14px;font-size:13px;cursor:pointer}
  .btn.ok.on{background:#1d9e6f;color:#fff;border-color:#1d9e6f}
  .btn.bad.on{background:#d34;color:#fff;border-color:#d34}
  .reasons{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
  .reasons.show{display:flex}
  .chip{border:1px solid #d6dbe3;background:#fff;border-radius:9px;padding:5px 11px;font-size:12px;cursor:pointer}
  .chip.on{background:#2f6bff;color:#fff;border-color:#2f6bff}
  .noteta{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid #d8dce4;border-radius:9px;padding:8px 10px;font-size:13px;min-height:46px;font-family:inherit}
  .hint{font-size:11px;color:#98a0ad;margin-top:6px}
  .replay-hint{margin-top:6px;font-size:12px;color:#a06b00;background:#fff7e8;border:1px solid #f0e0bb;border-radius:8px;padding:5px 10px}
  .backlog{width:100%;font-size:12px;color:#c33;background:#fdeaea;border:1px solid #f3c9c9;border-radius:8px;padding:6px 10px}
  .back{display:inline-block;margin:12px 14px 0;font-size:14px;color:#2f6bff;text-decoration:none}
  .empty{padding:30px;text-align:center;color:#7a828f;font-size:14px}
  .qimg{display:block;max-width:100%;margin:8px 0 2px;border-radius:8px}
</style>
</head>
<body>
<a class="back" href="./index.html">← 返回组卷网</a>
<div class="wrap">
  <div class="paper-card">
    <div class="paper-name" id="pname">专业课每日五题</div>
    <div class="paper-meta" id="pmeta">加载中…</div>
    <div class="stats" id="pstats"></div>
  </div>
  <div id="content"></div>
</div>
<script>
(function(){
  'use strict';
  var ZT_MAX = 16;              /* 题池：专题一~专题十六（学到新专题后改这里扩池） */
  var DAILY = 5;                /* 每日题数 */
  var LS_KEY = 'shuxue_progress_v1';
  var MODE = null;              /* 'server' | 'static' */
  var STATE = null;             /* 静态版进度 */
  var PICKS = [];               /* 今日五题 */
  var POOL = [];                /* 题池（换一批/统计都用它；PICKS 每次换批被整体替换，pool 不能挂在它身上） */
  var MARKED = {};              /* 本次会话内的打标覆盖（即时刷新状态用） */
  var TODAY = (function(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();

  function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderLatexMixed(el, str){
    if (!el) return;
    if (!window.katex) { el.textContent = str; return; }
    if (str.indexOf('$') < 0) {
      if (/[\u4e00-\u9fff]/.test(str)) { el.textContent = str; return; }
      try { window.katex.render(str, el, { throwOnError: false }); } catch (e) { el.textContent = str; }
      return;
    }
    el.textContent = '';
    var re = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g, m, last = 0;
    while ((m = re.exec(str)) !== null) {
      if (m.index > last) el.appendChild(document.createTextNode(str.slice(last, m.index)));
      var span = document.createElement('span');
      var tex = (m[1] !== undefined) ? m[1] : m[2];
      try { window.katex.render(tex, span, { throwOnError: false, displayMode: m[1] !== undefined }); }
      catch (e2) { span.textContent = m[0]; }
      el.appendChild(span);
      last = re.lastIndex;
    }
    if (last < str.length) el.appendChild(document.createTextNode(str.slice(last)));
  }

  /* ---------- 静态版进度（与主站共用同一 localStorage） ---------- */
  function loadState(){
    try { var raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return null;
  }
  function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch (e) {} }
  function qstate(){ return STATE.question_state || (STATE.question_state = {}); }
  function notesObj(){ return STATE.notes || (STATE.notes = {}); }
  function addDays(iso, days){ var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + days); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

  /* ---------- 每题的实时状态（统一成 live 对象；本次会话打标优先） ---------- */
  var RELEARN_INT = [1, 3, 7];  /* 回炉池：错后 1/3/7 天递增重现 */
  function liveOf(q){
    if (MARKED[q.id]) return MARKED[q.id];
    if (MODE === 'server') return q.live || {};
    var st = qstate()[q.id] || {};
    return { status: st.status, due: st.due, wrong_date: st.wrong_date, review_due: st.review_due,
             right_count: st.right_count, wrong_count: st.wrong_count, right_streak: st.right_streak,
             note: (notesObj()[q.id] || ''), reason: st.reason };
  }

  /* ---------- 选题：每天随机抽 5 道（当天固定，跨天自动换新）；到期回炉题优先占坑；做对的题冷却 7 天后回池 ---------- */
  var COOLDOWN_DAYS = 7;
  function hashSeed(str){
    var h = 2166136261;
    for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function mulberry(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function daysSince(iso){
    if (!iso) return 9999;
    var a = new Date(iso + 'T00:00:00'), b = new Date(TODAY + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }
  function inCooldown(q){
    var lv = liveOf(q);
    return lv.status === 'done' && daysSince(lv.right_date) < COOLDOWN_DAYS;
  }
  function rollNonce(){ try { return parseInt(localStorage.getItem('zy_roll_nonce') || '0', 10) || 0; } catch(e){ return 0; } }
  function bumpNonce(){ try { localStorage.setItem('zy_roll_nonce', String(rollNonce() + 1)); } catch(e){} }
  function drawPicks(pool, nonce){
    /* 到期回炉题（做错后 1/3/7 天到期）优先占坑（最多 3 题，最逾期优先），其余坑给新题随机 */
    var dueQs = [], fresh = [], cooldown = 0;
    pool.forEach(function(q){
      if (inCooldown(q)) { cooldown++; return; }
      var lv = liveOf(q);
      if ((lv.status === 'todo' || lv.status === 'relearn') && lv.due && lv.due <= TODAY) dueQs.push(q);
      else fresh.push(q);
    });
    var rng = mulberry(hashSeed(TODAY + '#' + nonce));
    function shuf(a){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    shuf(dueQs); shuf(fresh);
    dueQs.sort(function(a,b){ return (liveOf(a).due || '').localeCompare(liveOf(b).due || ''); });
    var picks = dueQs.slice(0, 3);
    if (picks.length < DAILY) picks = picks.concat(fresh.slice(0, DAILY - picks.length));
    if (picks.length < DAILY) {   /* 冷却中太多导致不够 → 最早做对的优先回池 */
      var cds = pool.filter(function(q){ return inCooldown(q); });
      cds.sort(function(a,b){ return (liveOf(a).right_date || '').localeCompare(liveOf(b).right_date || ''); });
      picks = picks.concat(cds.slice(0, DAILY - picks.length));
    }
    return { picks: picks, cooldown: cooldown, eligible: fresh.length + dueQs.length };
  }
  function loadPicks(pool){ return drawPicks(pool, rollNonce()).picks; }

  /* ---------- 打标：回炉池规则（服务端 progress.py / 静态版逻辑一致） ----------
     做错 → 1/3/7 天递增重现；错后做对 → 明天再来确认，连续做对三次 → done 移出 */
  function mark(q, val, reason){
    var prev = MARKED[q.id] || (MODE === 'server' ? (q.live || {}) : (qstate()[q.id] || {}));
    var s;
    if (val === 'right') {
      if (prev.status === 'done') return;
      var cnt = (prev.right_count || 0) + 1;
      if (prev.wrong_date) {
        var streak = (prev.right_streak || 0) + 1;
        s = (streak >= 3)
          ? { status: 'done', right_date: TODAY, right_count: cnt }
          : { status: 'relearn', wrong_date: prev.wrong_date, right_date: TODAY, right_streak: streak,
              wrong_count: (prev.wrong_count || 1), due: addDays(TODAY, 1) };
      } else {
        s = { status: 'review', right_date: TODAY, review_due: addDays(TODAY, 15), right_count: cnt };
      }
    } else {
      var wc = (prev.wrong_count || 0) + 1;
      s = { status: 'todo', wrong_date: TODAY, wrong_count: wc, right_streak: 0,
            due: addDays(TODAY, RELEARN_INT[Math.min(wc, RELEARN_INT.length) - 1]) };
      if (reason) s.reason = reason;
    }
    MARKED[q.id] = s;
    if (MODE === 'server') {
      var body = { paper_id: 'zy-' + Date.now(), results: {}, reasons: {} };
      body.results[q.id] = val;
      if (reason) body.reasons[q.id] = reason;
      return fetch('api/record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    }
    qstate()[q.id] = s;
    STATE.papers = STATE.papers || [];
    var rec = { id: 'zy-' + Date.now(), date: TODAY, results: {}, reasons: {} };
    rec.results[q.id] = val;
    if (reason) rec.reasons[q.id] = reason;
    STATE.papers.push(rec);
    /* 只保留最近 20 条本页记录：这些 results 已并入 question_state，纯冗余，不清理会撑爆 localStorage */
    var keepO = [], keepZ = [];
    STATE.papers.forEach(function(x){ (String(x.id || '').indexOf('zy-') === 0 ? keepZ : keepO).push(x); });
    STATE.papers = keepO.concat(keepZ.slice(-20));
    saveState();
    return Promise.resolve();
  }
  function saveNote(id, text){
    if (MODE === 'server') {
      return fetch('api/note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, note: text }) }).catch(function(){});
    }
    notesObj()[id] = text; saveState();
    return Promise.resolve();
  }

  /* ---------- 渲染 ---------- */
  function tagOf(q){
    var lv = liveOf(q);
    if (lv.status === 'done') return '<span class="tag ok">已掌握</span>';
    if (lv.status === 'relearn') return (lv.due && lv.due <= TODAY)
      ? '<span class="tag bad">回炉·确认中</span>'
      : '<span class="tag review">再对 ' + (3 - (lv.right_streak || 0)) + ' 次出池</span>';
    if (lv.due && lv.due <= TODAY) return '<span class="tag bad">待重做</span>';
    if (lv.status === 'todo' && lv.wrong_date) return '<span class="tag bad">已标记做错</span>';
    if (lv.status === 'review') return '<span class="tag review">待巩固</span>';
    return '<span class="tag">未做</span>';
  }
  /* ---------- 详解分区排版：【】行做标题，其余行渲染公式 ---------- */
  function formatSolution(el, text){
    el.textContent = '';
    String(text || '').split('\n').forEach(function(ln){
      var d = document.createElement('div');
      var mt = ln.match(/^(【[^】]+】)([\s\S]*)$/);
      if (mt) {
        d.className = 'sec ' + (ln.indexOf('易错') >= 0 ? 'warn' : ln.indexOf('答案') >= 0 ? 'ans' : ln.indexOf('步骤') >= 0 ? 'step' : 'kp');
        var ts = document.createElement('span');
        ts.textContent = mt[1];
        var cs = document.createElement('span');
        renderLatexMixed(cs, mt[2]);
        d.appendChild(ts); d.appendChild(cs);
      } else {
        renderLatexMixed(d, ln);
      }
      el.appendChild(d);
    });
  }
  function card(q, idx){
    var el = document.createElement('div');
    el.className = 'qcard';
    var lv0 = liveOf(q);
    if (lv0.status === 'done') el.classList.add('done');
    if (lv0.status === 'todo' && lv0.wrong_date) el.classList.add('wrong');
    el.innerHTML =
      '<div class="qhead"><span class="qno">第 ' + (idx + 1) + ' 题</span>' +
      '<span class="tag">' + escHtml(q.chapter_name || q.chapter) + '</span>' +
      (q.kp_sub ? '<span class="tag">' + escHtml(q.kp_sub) + '</span>' : '') +
      '<span data-role="st">' + tagOf(q) + '</span></div>' +
      '<div class="qtext katex-auto"></div>' +
      '<div class="btnrow">' +
      '<button class="btn ok" data-act="right">做对</button>' +
      '<button class="btn bad" data-act="wrong">做错</button>' +
      '<button class="btn" data-act="ans">看答案</button></div>' +
      '<div class="gate-hint">💡 提示：先自己完整做一遍再看答案，效果更好（此提示只出现一次）</div>' +
      '<div class="ansbox"><div class="at">答案' + (q.solution ? ' + 详解' : '') + '</div><div data-role="prevwrong"></div><div class="ansbody katex-ans"></div></div>' +
      '<div class="reasons" data-role="reasons">' +
      '<button class="chip" data-reason="概念不清">概念不清</button>' +
      '<button class="chip" data-reason="计算失误">计算失误</button>' +
      '<button class="chip" data-reason="方法不会">方法不会</button>' +
      '<button class="chip" data-reason="审题踩坑">审题踩坑</button>' +
      '<button class="chip" data-reason="直接确认">直接确认</button></div>' +
      '<textarea class="noteta" placeholder="笔记（自动保存）：突破口 / 易错点…">' + escHtml(liveOf(q).note || '') + '</textarea>' +
      '<div class="hint">' + (MODE === 'server' ? '进度同步到服务器（错题本/统计通用）' : '进度存本机，与主站共用') + '</div>';
    renderLatexMixed(el.querySelector('.katex-auto'), q.question_text || '');
    if (q.question_img) {
      var qi = document.createElement('img');
      qi.className = 'qimg';
      qi.src = 'data/' + q.question_img;
      qi.alt = '题目配图';
      qi.onerror = function(){ qi.style.display = 'none'; };
      el.querySelector('.qtext').after(qi);
    }
    var lvR = liveOf(q);
    if (lvR.wrong_date) {
      var rh = document.createElement('div');
      rh.className = 'replay-hint';
      rh.textContent = '🔁 回炉重做 · 上次做错于 ' + lvR.wrong_date + (lvR.status === 'relearn' ? ' · 已连对 ' + (lvR.right_streak || 0) + ' 次，再对 ' + (3 - (lvR.right_streak || 0)) + ' 次出池' : '');
      el.querySelector('.qtext').after(rh);
    }
    formatSolution(el.querySelector('.katex-ans'), q.solution || q.answer_text || '');
    if (q.answer_img) {
      var ai = document.createElement('img');
      ai.className = 'qimg';
      ai.src = 'data/' + q.answer_img;
      ai.alt = '答案配图';
      ai.onerror = function(){ ai.style.display = 'none'; };
      el.querySelector('.katex-ans').after(ai);
    }
    if (lvR.wrong_date) {
      var pw = el.querySelector('[data-role="prevwrong"]');
      var html = '';
      if (lvR.reason) html += '<div style="font-size:13px;color:#c33;margin:4px 0">上次错因：' + escHtml(lvR.reason) + '</div>';
      if (lvR.note) html += '<div style="font-size:13px;color:#5a6472;background:#f2f5fb;border-radius:8px;padding:6px 10px;margin:4px 0;white-space:pre-wrap">上次的笔记：' + escHtml(lvR.note) + '</div>';
      pw.innerHTML = html;
    }
    var noteTimer = null;
    var ta = el.querySelector('.noteta');
    ta.addEventListener('input', function(){
      clearTimeout(noteTimer);
      noteTimer = setTimeout(function(){ saveNote(q.id, ta.value); }, 600);
    });
    var hinted = false;
    el.querySelector('[data-act="ans"]').onclick = function(){
      var box = el.querySelector('.ansbox');
      if (!box.classList.contains('show') && !el.dataset.marked && !hinted) {
        hinted = true;
        el.querySelector('.gate-hint').classList.add('show');
        setTimeout(function(){ el.querySelector('.gate-hint').classList.remove('show'); }, 2800);
      }
      box.classList.toggle('show');
    };
    var stEl = el.querySelector('[data-role="st"]');
    el.querySelector('[data-act="right"]').onclick = function(){
      if (el.dataset.marked) return;   /* 防双击双计：一次打标定死 */
      el.dataset.marked = '1';
      mark(q, 'right').then(function(){
        var lv = liveOf(q);
        if (lv.status === 'done') {
          el.classList.add('done'); el.classList.remove('wrong');
          stEl.innerHTML = '<span class="tag ok">已掌握（出池）</span>';
        } else {
          stEl.innerHTML = '<span class="tag review">好！明天再来确认1次（' + lv.due + '）</span>';
        }
        refreshStats();
      });
    };
    var reasons = el.querySelector('[data-role="reasons"]');
    el.querySelector('[data-act="wrong"]').onclick = function(){
      reasons.classList.add('show');
    };
    Array.prototype.forEach.call(reasons.querySelectorAll('.chip'), function(c){
      c.onclick = function(){
        if (el.dataset.marked) return;   /* 防双击双计 */
        el.dataset.marked = '1';
        var reason = c.dataset.reason === '直接确认' ? null : c.dataset.reason;
        mark(q, 'wrong', reason).then(function(){
          el.classList.add('wrong');
          var gap = RELEARN_INT[Math.min(liveOf(q).wrong_count, RELEARN_INT.length) - 1];
          stEl.innerHTML = '<span class="tag bad">已标记做错·' + gap + '天后重现' + (reason ? '·' + reason : '') + '</span>';
          refreshStats();
        });
      };
    });
    return el;
  }
  function refreshStats(){
    var pool = POOL, lv, done = 0, due = 0, overdue = 0, todayDone = 0, cooldown = 0;
    pool.forEach(function(q){
      lv = liveOf(q);
      if (lv.status === 'done') done++;
      if (inCooldown(q)) cooldown++;
      if (lv.due && lv.due <= TODAY && lv.status !== 'done') {
        due++;
        if (lv.due < TODAY) overdue++;
      }
    });
    PICKS.forEach(function(q){ lv = liveOf(q); if (lv.status === 'done' || lv.wrong_date === TODAY) todayDone++; });
    var st = document.getElementById('pstats');
    if (st) st.innerHTML =
      '<div class="stat">题池 <b>' + pool.length + '</b> 题（专题一~十六）</div>' +
      (cooldown > 0 ? '<div class="stat">冷却回池 <b>' + cooldown + '</b>（做对第 7 天自动回池）</div>' : '') +
      '<div class="stat ok">已掌握 <b>' + done + '</b></div>' +
      '<div class="stat bad">待重做 <b>' + due + '</b></div>' +
      (overdue > 0 ? '<div class="stat bad">逾期未清 <b>' + overdue + '</b></div>' : '') +
      '<div class="stat">今日完成 <b>' + todayDone + '/' + PICKS.length + '</b></div>' +
      (due >= 6 ? '<div class="backlog">⚠️ 回炉池积压 ' + due + ' 题待重做（' + overdue + ' 题已逾期）——建议今天先清回炉，再按「换一批」开新题</div>' : '') +
      '<div class="bar" style="width:100%"><i style="width:' + Math.round(done / pool.length * 100) + '%"></i></div>';
  }

  function reshuffle(){
    bumpNonce();
    var res = drawPicks(POOL, rollNonce());
    PICKS = res.picks;
    var root = document.getElementById('content');
    root.innerHTML = '';
    PICKS.forEach(function(q, i){ root.appendChild(card(q, i)); });
    refreshStats();
  }

  /* ---------- 启动：探测服务端 → 回退静态 ---------- */
  function start(questions){
    var pool = questions.filter(function(q){
      return q.source === 'qhzt' && parseInt(String(q.chapter).replace('专题', ''), 10) <= ZT_MAX;
    });
    pool.sort(function(a,b){ return a.id.localeCompare(b.id); });
    if (!pool.length) { document.getElementById('pmeta').textContent = '题池为空'; return; }
    POOL = pool;
    PICKS = loadPicks(pool);
    var meta = document.getElementById('pmeta');
    meta.textContent = TODAY + ' · ' +
      (MODE === 'server' ? '本机版（进度同步服务器）' : '静态版（进度存本机）') + ' · 每天随机抽 5 题（做对的题冷却 7 天后自动回池）· 错题按 1/3/7 天回炉优先重现，连对 3 次出池 · 按「换一批」立即换新';
    var rb = document.createElement('button');
    rb.textContent = '🔄 换一批';
    rb.style.cssText = 'margin-left:10px;padding:2px 12px;border:1px solid #b9c6d8;border-radius:14px;background:#fff;color:#1f6fb2;cursor:pointer;font-size:12px;vertical-align:middle;';
    rb.onclick = reshuffle;
    meta.appendChild(rb);
    refreshStats();
    var root = document.getElementById('content');
    PICKS.forEach(function(q, i){ root.appendChild(card(q, i)); });
  }
  document.getElementById('pmeta').textContent = '加载中…';
  fetch('api/questions').then(function(r){ if (!r.ok) throw new Error('no api'); return r.json(); }).then(function(qs){
    MODE = 'server'; start(qs);
  }).catch(function(){
    fetch('data/questions.json').then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); }).then(function(qs){
      MODE = 'static';
      STATE = loadState();
      if (!STATE) {
        fetch('data/progress.json').then(function(r){ return r.json(); }).then(function(p){
          STATE = (p && typeof p === 'object') ? p : { papers: [], notes: {}, question_state: {} };
          if (!STATE.question_state) STATE.question_state = {};
          if (!STATE.notes) STATE.notes = {};
          if (!STATE.papers) STATE.papers = [];
          saveState(); start(qs);
        }).catch(function(){ STATE = { papers: [], notes: {}, question_state: {} }; saveState(); start(qs); });
      } else { start(qs); }
    }).catch(function(){
      document.getElementById('pmeta').textContent = '题库加载失败：请确认通过 https 访问本站后刷新（本地双击打开无法加载数据）';
    });
  });
})();
</script>
</body>
</html>
