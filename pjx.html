<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研英语大作文模板 · 交互拼装器（AI归来27版全覆盖）</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#1d2733; --sub:#5b6b7c; --line:#dde4ec;
  --blue:#1a5fb4; --blue2:#eaf2fd; --gold:#b7791f; --gold2:#fdf3e0;
  --ok:#1b7f4d; --ok2:#e8f5ee; --ph:#9aa7b4; --red:#b03636;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.65;}
button{font-family:inherit; cursor:pointer;}
select,input,textarea{font-family:inherit; font-size:13px;}
/* ---------- header ---------- */
#hd{position:sticky; top:0; z-index:50; background:linear-gradient(180deg,#ffffff,#f8fafd); border-bottom:1px solid var(--line); padding:8px 14px 6px;}
#hd .row1{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
#hd h1{font-size:17px; color:var(--blue); letter-spacing:.5px; white-space:nowrap;}
#hd .tag{font-size:11px; color:var(--gold); background:var(--gold2); border:1px solid #ecd9b0; border-radius:10px; padding:1px 8px; white-space:nowrap;}
#hd .sp{flex:1;}
.btn{border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:4px 12px; font-size:13px;}
.btn:hover{border-color:var(--blue); color:var(--blue); background:var(--blue2);}
.btn.primary{background:var(--blue); color:#fff; border-color:var(--blue);}
.btn.primary:hover{filter:brightness(1.08); color:#fff;}
.btn.warn{color:var(--red); border-color:#e5c4c4;}
.btn.warn:hover{background:#fdf1f1; border-color:var(--red); color:var(--red);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
#presetSel{max-width:340px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);}
.row2{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:6px;}
.tgl{display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); background:#fff; border-radius:8px; padding:3px 10px; font-size:12.5px; color:var(--sub); user-select:none;}
.tgl b{width:30px; height:16px; border-radius:8px; background:#c8d2dc; position:relative; transition:.15s;}
.tgl b::after{content:''; position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%; background:#fff; transition:.15s;}
.tgl.on{color:var(--blue); border-color:#bcd2f0; background:var(--blue2);}
.tgl.on b{background:var(--blue);}
.tgl.on b::after{left:16px;}
.hint{font-size:12px; color:var(--sub);}
/* ---------- type nav ---------- */
#typeNav{display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px 0;}
#typeNav .grp{display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;}
#typeNav .grp .glabel{background:var(--blue2); color:var(--blue); font-size:12px; padding:6px 8px; display:flex; align-items:center; font-weight:bold; border-right:1px solid var(--line);}
.tbtn{border:0; border-right:1px solid var(--line); background:#fff; padding:6px 11px; font-size:13px; color:var(--sub);}
.tbtn:last-child{border-right:0;}
.tbtn:hover{background:var(--blue2); color:var(--blue);}
.tbtn.on{background:var(--blue); color:#fff; font-weight:bold;}
/* ---------- layout ---------- */
#main{display:flex; gap:14px; padding:12px 14px 80px; align-items:flex-start;}
#editor{flex:1.35; min-width:0;}
#preview{flex:1; min-width:340px; position:sticky; top:96px; max-height:calc(100vh - 116px); overflow:auto;}
@media (max-width:960px){ #main{flex-direction:column;} #preview{position:static; max-height:none; width:100%;} }
/* ---------- paragraphs & sentence cards ---------- */
.para{margin-bottom:14px;}
.para>h2{font-size:14.5px; color:var(--blue); border-left:4px solid var(--blue); padding-left:8px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.para>h2 .mini{font-size:11.5px; color:var(--sub); font-weight:normal;}
.scard{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:8px;}
.scard.hidden{display:none;}
.shead{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.stitle{font-weight:bold; font-size:13.5px; color:var(--ink); white-space:nowrap;}
.vsel{flex:1; min-width:200px; border:1px solid var(--line); border-radius:7px; padding:3px 6px; background:#fbfcfe; color:var(--ink);}
.snote{font-size:12px; color:var(--gold); background:var(--gold2); border-radius:6px; padding:3px 8px; margin-top:6px; line-height:1.55;}
.slots{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
.chip{border:1px dashed var(--ph); background:#fbfcfe; color:var(--sub); border-radius:14px; padding:3px 10px; font-size:12.5px; max-width:100%; text-align:left;}
.chip .lbl{opacity:.75;}
.chip.filled{border:1px solid #9cc0ee; background:var(--blue2); color:var(--ink); font-weight:bold;}
.chip:hover{border-color:var(--blue); color:var(--blue);}
.chip.filled:hover{color:var(--blue);}
/* ---------- preview ---------- */
.pvcard{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden;}
.pvhead{display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--blue2); border-bottom:1px solid var(--line);}
.pvhead h3{font-size:13.5px; color:var(--blue); flex:1;}
.pvbody{padding:10px 13px;}
.pline{margin-bottom:8px;}
.pline.en{color:var(--ink);}
.pline.zh{color:var(--sub); font-size:13px; border-left:3px solid #d7e3f4; padding-left:8px;}
.sv{color:var(--blue); font-weight:bold;}
.ph{color:var(--ph); font-weight:bold; border-bottom:1px dashed var(--ph); padding:0 2px; background:#fbfcfe;}
.meta{font-size:11.5px; color:var(--ph); margin-top:4px;}
body.lean .pline.zh{display:none;}
body.lean .snote{display:none;}
body.lean .meta{display:none;}
/* ---------- slot panel ---------- */
#mask{position:fixed; inset:0; background:rgba(20,30,45,.45); display:none; z-index:90;}
#mask.show{display:block;}
#panel{position:fixed; z-index:95; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px,94vw); max-height:82vh; background:#fff; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.25); display:none; flex-direction:column;}
#panel.show{display:flex;}
#pTitle{padding:12px 16px 8px; font-size:14.5px; font-weight:bold; color:var(--blue); display:flex; align-items:center; gap:8px;}
#pTitle .x{margin-left:auto; border:0; background:none; font-size:18px; color:var(--sub); padding:0 4px;}
#pNote{padding:0 16px 6px; font-size:12px; color:var(--gold);}
#pOpts{overflow:auto; padding:4px 10px 8px; flex:1;}
.opt{border:1px solid var(--line); border-radius:9px; padding:6px 10px; margin:5px 2px; cursor:pointer; background:#fff;}
.opt:hover{border-color:var(--blue); background:var(--blue2);}
.opt .oen{font-size:13px; color:var(--ink); word-break:break-word;}
.opt .oen.filled{color:var(--blue); font-weight:bold;}
.opt .ozh{font-size:11.5px; color:var(--sub); margin-top:1px;}
#pCustom{border-top:1px solid var(--line); padding:10px 14px 12px; display:flex; flex-direction:column; gap:6px; background:#fbfcfe; border-radius:0 0 14px 14px;}
#pCustom .crow{display:flex; gap:6px; align-items:center;}
#pCustom label{font-size:12px; color:var(--sub); white-space:nowrap;}
#pEn,#pZh{flex:1; border:1px solid var(--line); border-radius:7px; padding:5px 8px;}
/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:36px; transform:translateX(-50%); background:rgba(29,39,51,.92); color:#fff; padding:8px 18px; border-radius:20px; font-size:13px; opacity:0; transition:.25s; z-index:120; pointer-events:none;}
#toast.show{opacity:1;}
footer{padding:0 14px 26px; font-size:12px; color:var(--ph); text-align:center;}
</style>
</head>

function firstAlphaIdx(t,from){

 while(i<t.length){
  var ch=t.charAt(i);
  if(ch==='<'){var j=t.indexOf('>',i);if(j<0)return -1;i=j+1;continue;}

  return /[A-Za-z]/.test(ch)?i:-1;
 }

}
function applyEdits(t,edits){

function capFix(t){

  var i=firstAlphaIdx(t,m.index+m[0].length);
  if(i<0)continue;
  var ch=t.charAt(i);
  if(ch>='a'&&ch<='z')edits.push([i,ch.toUpperCase()]);
 }

}
function commaLower(t){

  BANKS.MCONN.forEach(function(o,i){h+='<option value="'+i+'"'+(i===state.p3.mc?' selected':'')+'>'+esc(o[2])+'</option>';});
  h+='</select></div></div>';
  var md1=cloneShallow(SENT['p3.m']);md1.title='措施一';
  h+=cardHtml('p3.m1',md1,state.p3.m1.vi);
  var md2=cloneShallow(SENT['p3.m']);md2.title='措施二';
  h+=cardHtml('p3.m2',md2,state.p3.m2.vi);
  h+=cardHtml('p3.fut',SENT['p3.fut'],state.p3.fut.vi);
 }else{
  h+=cardHtml('p3.trend',SENT['p3.trend'],state.p3.trend.vi);
 }
 h+='</div>';
 E.innerHTML=h;
}
function cloneShallow(d){return {title:d.title,note0:d.note0,glue:d.glue,vars:d.vars,merge:d.merge};}
function pvCard(title,en,zh,keyPara){
 var wc=wordCount(en),pc=phCount(en);
 var h='<div class="pvcard"><div class="pvhead"><h3>'+esc(title)+'</h3><button class="btn" data-copy="'+keyPara+'">📋 复制本段</button></div><div class="pvbody">';
 h+='<div class="pline en">'+en+'</div>';
 if(zh&&state.zh&&!state.lean)h+='<div class="pline zh">'+zh+'</div>';
 h+='<div class="meta">约 '+wc+' 词'+(pc?' · 未填槽位 '+pc+' 个':'')+'</div>';
 h+='</div></div>';
 return h;
}
function renderPreview(){
 var P=document.getElementById('preview');
 var p1=renderP1Segs(),p2=renderP2Segs(),p3=renderP3Segs();
 var tname=TYPES[state.type]?TYPES[state.type].name:'';
 var h=pvCard('第一段 · '+tname,p1.en,p1.zh,'p1')+pvCard('第二段 · 通用（原因分析）',p2.en,p2.zh,'p2')+pvCard('第三段 · 通用',p3.en,p3.zh,'p3');
 var all='第一段：\n'+plain(p1.en)+'\n\n第二段：\n'+plain(p2.en)+'\n\n第三段：\n'+plain(p3.en)+'\n\n（全文约 '+(wordCount(p1.en)+wordCount(p2.en)+wordCount(p3.en))+' 词'+(phCount(p1.en)+phCount(p2.en)+phCount(p3.en)?'，仍有未填槽位':'')+'）';
 if(state.zh&&!state.lean){all+='\n\n——中文对照——\n【第一段】'+plain(p1.zh)+'\n【第二段】'+plain(p2.zh)+'\n【第三段】'+plain(p3.zh);}
 P.innerHTML=h;
 P.setAttribute('data-full',all);
}
function buildTypeNav(){
 var nav=document.getElementById('typeNav');var h='';
 GROUPS.forEach(function(g){
  h+='<div class="grp"><span class="glabel">'+esc(g[0])+'</span>';
  g[1].forEach(function(t){h+='<button class="tbtn'+(t===state.type?' on':'')+'" data-type="'+t+'">'+esc(TYPES[t].name)+'</button>';});
  h+='</div>';
 });
 nav.innerHTML=h;
}
function buildPresetSel(){
 var sel=document.getElementById('presetSel');var h='<option value="-1">—— 真题预设（一键载入）——</option>';
 PRESETS.forEach(function(p,i){h+='<option value="'+i+'">'+esc(p.n)+'</option>';});
 sel.innerHTML=h;
}
function rerenderAll(){
 buildTypeNav();renderEditor();renderPreview();
 var bs=document.getElementById('bootStatus');
 if(bs)bs.textContent='✅ 已加载 v1.0 · 题型10 · 预设28 · 句式197 · 词库756 · 数据自动保存在本机浏览器';
 document.body.classList.toggle('lean',!!state.lean);
 setTgl('tglZh',state.zh);setTgl('tglLean',state.lean);setTgl('tglNote',state.note);
 var u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');
 u.disabled=hist.length<=1;r.disabled=redo.length===0;
 var hint=document.getElementById('saveHint');
 hint.textContent='已自动保存到本地 · 历史'+hist.length+'步';
}
function setTgl(id,on){document.getElementById(id).classList.toggle('on',!!on);}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1600);}
/* ---------- panel ---------- */
var curSlot=null,curScope=null;
function openPanel(scope,slotId){
 curScope=scope;curSlot=slotId;
 var sl=SLOTS[slotId]||{lb:slotId,bank:''};
 var st=scopeObj(scope);var v=st?st.v[slotId]:undefined;var zv=st?st.zv[slotId]:undefined;
 document.getElementById('pName').textContent='槽位：'+sl.lb;
 document.getElementById('pNote').textContent=sl.bank?('从词库点选（含中文注释），或自行输入：'):'该槽位为自由输入（可参考真题预设的写法）：';
 var box=document.getElementById('pOpts');var h='';
 var cur=st?st.v[slotId]:undefined;
 if(sl.bank&&BANKS[sl.bank]){
  BANKS[sl.bank].forEach(function(o,i){
   h+='<div class="opt" data-en="'+esc(o[0])+'" data-zh="'+esc(o[1])+'"><div class="oen'+(o[0]===cur?' filled':'')+'">'+(o[0]===''?'（留空/不加）':esc(o[0]))+'</div><div class="ozh">'+esc(o[1])+'</div></div>';
  });
 }
 box.innerHTML=h||'<div class="ozh" style="padding:8px">无词库，请直接在下方输入。</div>';
 document.getElementById('pEn').value=v===undefined?'':v;
 document.getElementById('pZh').value=zv===undefined?'':zv;
 document.getElementById('mask').classList.add('show');
 document.getElementById('panel').classList.add('show');
}
function closePanel(){document.getElementById('mask').classList.remove('show');document.getElementById('panel').classList.remove('show');curSlot=null;curScope=null;}
function setSlot(en,zh){
 if(!curScope||!curSlot)return;
 var st=scopeObj(curScope);if(!st)return;
 if(en===null){delete st.v[curSlot];delete st.zv[curSlot];}
 else{st.v[curSlot]=en;st.zv[curSlot]=(zh!=null&&zh!=='')?zh:'';}
 closePanel();commit();
}
/* ---------- copy/export ---------- */
function copyText(t,okMsg){
 var done=false;
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText){
   var pr=navigator.clipboard.writeText(t);
   if(pr&&pr.catch)pr.catch(function(){});
   done=true;
  }
 }catch(e){done=false;}
 if(!done){
  try{
   var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
   done=document.execCommand&&document.execCommand('copy');
   document.body.removeChild(ta);
  }catch(e){done=false;}
 }
 toast(done?(okMsg||'已复制到剪贴板'):'复制失败，请手动选择文本复制');
}
function fullText(){
 var P=document.getElementById('preview');return P.getAttribute('data-full')||'';
}
function exportTxt(){
 try{
  var blob=new Blob([fullText()],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='考研大作文模板_'+(TYPES[state.type]?TYPES[state.type].name:'')+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('已导出 .txt');
 }catch(e){toast('当前环境不支持导出，请用复制按钮');}
}
/* ---------- events ---------- */
function wire(){
 document.getElementById('typeNav').addEventListener('click',function(e){
  var b=e.target.closest('.tbtn');if(!b)return;
  if(b.getAttribute('data-type')===state.type)return;
  state.type=b.getAttribute('data-type');commit();
 });
 document.getElementById('presetSel').addEventListener('change',function(e){
  var i=+e.target.value;if(i<0)return;
  applyPreset(PRESETS[i]);toast('已载入预设：'+PRESETS[i].n);
  e.target.value='-1';
 });
 document.getElementById('btnUndo').addEventListener('click',undo);
 document.getElementById('btnRedo').addEventListener('click',redoFn);
 document.getElementById('btnClear').addEventListener('click',function(){
  var zh=state.zh,lean=state.lean,note=state.note;
  pushHistory();
  state=defaultState();state.zh=zh;state.lean=lean;state.note=note;
  save();rerenderAll();toast('已清空（可用撤销恢复）');
 });
 document.getElementById('btnCopyAll').addEventListener('click',function(){copyText(fullText(),'全文已复制（含未填槽位占位）');});
 document.getElementById('btnExport').addEventListener('click',exportTxt);
 ['tglZh','tglLean','tglNote'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(){
   if(id==='tglZh')state.zh=!state.zh;
   if(id==='tglLean')state.lean=!state.lean;
   if(id==='tglNote')state.note=!state.note;
   commit();
  });
 });
 document.getElementById('editor').addEventListener('change',function(e){
  var s=e.target;if(!s.classList.contains('vsel'))return;
  var act=s.getAttribute('data-act'),sc=s.getAttribute('data-scope');
  var vi=+s.value;
  if(act==='tr'){state.p2.tr=vi;}
  else if(act==='cn'){state.p2.cn=vi;}
  else if(act==='mc'){state.p3.mc=vi;}
  else if(act==='op'){state.p3.op=vi;}
  else if(act==='p3mode'){state.p3.mode=s.value;}
  else if(sc){var o=scopeObj(sc);if(o)o.vi=vi;}
  commit();
 });
 document.getElementById('editor').addEventListener('click',function(e){
  var c=e.target.closest('.chip');if(!c)return;
  openPanel(c.getAttribute('data-scope'),c.getAttribute('data-slot'));
 });
 document.getElementById('preview').addEventListener('click',function(e){
  var b=e.target.closest('[data-copy]');if(!b)return;
  var k=b.getAttribute('data-copy');
  var seg=k==='p1'?renderP1Segs():k==='p2'?renderP2Segs():renderP3Segs();
  copyText(plain(seg.en),'本段已复制');
 });
 document.getElementById('pOpts').addEventListener('click',function(e){
  var o=e.target.closest('.opt');if(!o)return;
  setSlot(o.getAttribute('data-en'),o.getAttribute('data-zh'));
 });
 document.getElementById('pClose').addEventListener('click',closePanel);
 document.getElementById('mask').addEventListener('click',closePanel);
 document.getElementById('pSave').addEventListener('click',function(){
  var en=document.getElementById('pEn').value;
  if(en===''){toast('请输入内容，或点“清除该槽”');return;}
  setSlot(en,document.getElementById('pZh').value);
 });
 document.getElementById('pClearSlot').addEventListener('click',function(){setSlot(null,null);});
 document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault();redoFn();}
  if(e.key==='Escape')closePanel();
 });
}
/* ---------- init ---------- */
function buildRegistry(){
 SLOTS={};
 Object.keys(SENT).forEach(function(k){
  defVars(k).forEach(function(v){(v.s||[]).forEach(function(sl){SLOTS[sl.id]={lb:sl.lb,bank:sl.bank||''};});});
 });
}
function counts(){
 var variants=0,banks=0;
 Object.keys(SENT).forEach(function(k){variants+=defVars(k).length;});
 Object.keys(BANKS).forEach(function(k){banks+=BANKS[k].length;});
 return {variants:variants,bankOpts:banks,presets:PRESETS.length,slots:Object.keys(SLOTS).length,types:Object.keys(TYPES).length};
}
function init(){
 buildRegistry();
 loadState();
 buildPresetSel();
 wire();
 rerenderAll();
}
init();
window.__APP__={state:function(){return state;},TYPES:TYPES,SENT:SENT,BANKS:BANKS,PRESETS:PRESETS,CONNS:CONNS,SLOTS:SLOTS,
 polish:polish,capFix:capFix,commaLower:commaLower,isPluralEn:isPluralEn,fillTpl:fillTpl,
 counts:counts,rerenderAll:rerenderAll,applyPreset:applyPreset,scopeObj:scopeObj,defVars:defVars,
 fullText:fullText,renderP1Segs:renderP1Segs,renderP2Segs:renderP2Segs,renderP3Segs:renderP3Segs};
})();
</script>
</body>
