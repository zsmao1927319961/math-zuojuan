<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在线刷题 · 知识点闯关</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<style>
  body{background:#f4f6fa;margin:0;font-family:-apple-system,'PingFang SC',sans-serif;color:#20242c}
  .wrap{max-width:820px;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  .back{display:inline-block;margin:10px 14px 0;font-size:14px;color:#2f6bff;text-decoration:none}
  .cd{font-size:12px;color:#b26a00;background:#fff7e0;border:1px solid #f0dfae;border-radius:12px;padding:2px 10px;margin-left:8px}
  .paper-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(30,40,60,.06);margin-bottom:14px}
  .paper-name{font-size:17px;font-weight:700}
  .paper-meta{font-size:12px;color:#7a828f;margin-top:4px}
  .tag{font-size:11px;background:#eef1f6;color:#5a6472;border-radius:6px;padding:2px 7px;white-space:nowrap}
  .tag.ok{background:#e8f7f0;color:#1d9e6f}
  .tag.review{background:#fff4e0;color:#a06b00}
  .tag.bad{background:#fdeaea;color:#d34}
  .tag.fav{background:#f3ecff;color:#7a3ff2}
  .stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .stat{background:#f2f5fb;border-radius:10px;padding:6px 11px;font-size:12.5px}
  .stat b{font-size:15px}
  .stat.ok b{color:#1d9e6f}.stat.bad b{color:#d34}.stat.rev b{color:#a06b00}
  .bar{height:8px;background:#e8ecf3;border-radius:4px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#1d9e6f,#4cc08a);border-radius:4px;transition:width .3s}
  /* 目录树 */
  .tree details{margin:2px 0}
  .tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;font-size:14.5px}
  .tree summary::-webkit-details-marker{display:none}
  .tree summary:hover{background:#f2f5fb}
  .tree summary .tw{color:#98a0ad;font-size:11px;transition:transform .15s;display:inline-block}
  .tree details[open]>summary .tw{transform:rotate(90deg)}
  .tree .cnt{margin-left:auto;font-size:11.5px;color:#7a828f;background:#f2f5fb;border-radius:8px;padding:1px 8px}
  .tree .cnt.has{background:#e8f7f0;color:#1d9e6f;font-weight:700}
  .tree .row{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 26px;border-radius:10px;font-size:13.5px;cursor:pointer}
  .tree .row:hover{background:#f2f5fb}
  .tree .row.empty{color:#b6bdc9}
  .tree .row .cnt{margin-left:auto}
  .tree .lv1{font-weight:700;font-size:15px}
  .tree .lv2{font-weight:600}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .qbtn{border:1px solid #d6dbe3;background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
  .qbtn.hot{background:#fdeaea;border-color:#f3c9c9;color:#c33}
  .qbtn.star{background:#f3ecff;border-color:#ddc8ff;color:#7a3ff2}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{border:1px solid #d6dbe3;background:#fff;border-radius:9px;padding:4px 11px;font-size:12px;cursor:pointer}
  .chip.on{background:#2f6bff;color:#fff;border-color:#2f6bff}
  /* 题卡 */
  .qcard{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(30,40,60,.06);margin-bottom:14px;padding:12px 16px;scroll-margin-top:70px}
  .qcard.done{border-left:4px solid #1d9e6f}
  .qcard.shaky{border-left:4px solid #e8a33d}
  .qcard.unknown{border-left:4px solid #c0504d}
  .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .qno{font-weight:700;font-size:15px}
  .star{margin-left:auto;border:none;background:none;font-size:18px;cursor:pointer;color:#c9ced8;line-height:1}
  .star.on{color:#f2b01e}
  .qtext{font-size:16px;line-height:2;color:#222;background:#fff;padding:6px 2px;text-align:left;white-space:pre-wrap;overflow-x:auto}
  .qimg{display:block;max-width:100%;margin:8px 0 2px;border-radius:8px}
  .ansbox{display:none;margin-top:10px;border-top:1px dashed #d8dce4;padding-top:8px}
  .ansbox.show{display:block}
  .ansbox .at{font-size:12px;color:#a06b00;font-weight:700;margin-bottom:4px}
  .ansbody{font-size:14px;line-height:1.95;color:#333;white-space:pre-wrap}
  .ansbox .sec{font-weight:700;margin:8px 0 2px;font-size:13.5px}
  .ansbox .sec.kp{color:#1a6b47}.ansbox .sec.step{color:#2f6bff}.ansbox .sec.ans{color:#a06b00}.ansbox .sec.warn{color:#c33}
  .radio-row{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
  .radio-opt{border:1.5px solid #d6dbe3;background:#fff;border-radius:10px;padding:8px 0;width:52px;text-align:center;font-weight:700;font-size:15px;cursor:pointer}
  .radio-opt.pick{border-color:#2f6bff;background:#eaf1ff;color:#2f6bff}
  .radio-opt.right{border-color:#1d9e6f;background:#e8f7f0;color:#1d9e6f}
  .radio-opt.wrongpick{border-color:#d34;background:#fdeaea;color:#d34}
  .radio-opt:disabled{cursor:default;opacity:.75}
  .radio-opt.right:disabled,.radio-opt.wrongpick:disabled{opacity:1}
  .verdict{margin-top:8px;font-size:13.5px;font-weight:700;border-radius:9px;padding:7px 12px;display:none}
  .verdict.ok{display:block;background:#e8f7f0;color:#1d9e6f}
  .verdict.bad{display:block;background:#fdeaea;color:#d34}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{border:1px solid #d6dbe3;background:#f7f8fb;border-radius:9px;padding:7px 15px;font-size:13px;cursor:pointer}
  .btn.done.on{background:#1d9e6f;color:#fff;border-color:#1d9e6f}
  .btn.shaky.on{background:#e8a33d;color:#fff;border-color:#e8a33d}
  .btn.unknown.on{background:#c0504d;color:#fff;border-color:#c0504d}
  .reasons{display:none;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .reasons.show{display:flex}
  .reasons .rt{font-size:12px;color:#7a828f}
  .noteta{width:100%;box-sizing:border-box;margin-top:10px;border:1px solid #d8dce4;border-radius:9px;padding:8px 10px;font-size:13px;min-height:44px;font-family:inherit}
  .hint{font-size:11px;color:#98a0ad;margin-top:6px}
  .replay-hint{margin-top:6px;font-size:12px;color:#a06b00;background:#fff7e8;border:1px solid #f0e0bb;border-radius:8px;padding:5px 10px}
  .empty{padding:30px;text-align:center;color:#7a828f;font-size:14px}
  /* 复测计划 */
  .due-item{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px dashed #e3e7ee;font-size:13.5px;cursor:pointer}
  .due-item .btn{white-space:nowrap}
  .due-item .d{font-size:11.5px;color:#c33;background:#fdeaea;border-radius:6px;padding:1px 7px;white-space:nowrap}
  .due-item .d.future{color:#7a828f;background:#f2f5fb}
  .plan-head{font-size:13px;font-weight:700;color:#5a6472;margin:14px 0 4px}
  .subtabs{display:flex;gap:6px;margin:8px 0}
</style>

<body>
<a class="back" href="./index.html">← 返回组卷网</a><span class="cd" id="cd"></span>
<div class="wrap">
  <!-- ====== 目录视图 ====== -->
  <div id="view-dir">
    <div class="paper-card">
      <div class="paper-name">在线刷题 · 按知识点</div>
      <div class="paper-meta" id="dirmeta">目录按大观园知识点划分，题目已对照挂到各知识点下</div>
      <div class="stats" id="dirstats"></div>
    </div>
    <div class="quick">
      <button class="qbtn hot" id="btn-retest">🔁 错题复测</button>
      <button class="qbtn star" id="btn-favs">⭐ 我的收藏</button>
    </div>
    <div class="paper-card tree" id="tree"></div>
  </div>

  <!-- ====== 刷题视图 ====== -->
  <div id="view-practice" hidden>
    <div class="paper-card">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn" id="btn-back">← 目录</button>
        <div class="paper-name" id="ptitle" style="font-size:15px"></div>
      </div>
      <div class="chiprow" id="pfilter">
        <button class="chip on" data-f="">全部</button>
        <button class="chip" data-f="todo">只看未做</button>
        <button class="chip" data-f="wrong">只看有问题</button>
      </div>
      <div class="stats" id="pstats"></div>
    </div>
    <div id="plist"></div>
  </div>

  <!-- ====== 复测视图 ====== -->
  <div id="view-retest" hidden>
    <div class="paper-card">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn" id="btn-back2">← 目录</button>
        <div class="paper-name" style="font-size:15px">🔁 错题复测</div>
        <span class="tag" id="retest-sort-wrap" style="display:flex;gap:6px;align-items:center">
          <button class="chip on" data-sort="due" style="padding:2px 9px">最早到期优先</button>
          <button class="chip" data-sort="recent" style="padding:2px 9px">最近错题优先</button>
        </span>
      </div>
      <div class="paper-meta">首次评「不熟练 / 不会」后明天起进复测计划；复测后再评「不会」按 1/3/7 天排，再评「不熟练」按 2/5/10 天排；未到期再评不重置进度；评「掌握」出池。</div>
      <div class="stats" id="restats"></div>
    </div>
    <div id="relist"></div>
    <div class="plan-head" id="plan-head" hidden>未来复测计划（点开可提前刷，提前评价不计入复测次数）</div>
    <div id="planlist"></div>
  </div>
</div>
<div id="toast" hidden style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,24,32,.92);color:#fff;border-radius:10px;padding:9px 18px;font-size:13.5px;z-index:99"></div>

<script>
(function(){
'use strict';
var LS_KEY = 'shuxue_progress_v1';
var TODAY = (function(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
var EXAM = '2026-12-19';
var STATE = null, QS = [], QMAP = {}, KN = null, NODE = {};
var MARKED = {};          // 本次会话打标覆盖（即时刷新 UI）
var CUR_LIST = [];        // 当前刷题列表（题目对象数组）
var CUR_TITLE = '';
var P_FILTER = '';

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderLatexMixed(el, str){
  if (!el) return;
  if (!window.katex) { el.textContent = str; return; }
  if (str.indexOf('$') < 0) {
    if (/[\u4e00-\u9fff]/.test(str)) { el.textContent = str; return; }
    try { window.katex.render(str, el, { throwOnError: false }); } catch (e) { el.textContent = str; }
    return;
  }
  el.textContent = '';
  var re = /\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g, m, last = 0;
  while ((m = re.exec(str)) !== null) {
    if (m.index > last) el.appendChild(document.createTextNode(str.slice(last, m.index)));
    var span = document.createElement('span');
    var tex = (m[1] !== undefined) ? m[1] : m[2];
    try { window.katex.render(tex, span, { throwOnError: false, displayMode: m[1] !== undefined }); }
    catch (e2) { span.textContent = m[0]; }
    el.appendChild(span);
    last = re.lastIndex;
  }
  if (last < str.length) el.appendChild(document.createTextNode(str.slice(last)));
}
function formatSolution(el, text){
  el.textContent = '';
  String(text || '').split('\n').forEach(function(ln){
    var d = document.createElement('div');
    var mt = ln.match(/^(【[^】]+】)([\s\S]*)$/);
    if (mt) {
      d.className = 'sec ' + (ln.indexOf('易错') >= 0 ? 'warn' : ln.indexOf('答案') >= 0 ? 'ans' : ln.indexOf('步骤') >= 0 ? 'step' : 'kp');
      var ts = document.createElement('span'); ts.textContent = mt[1];
      var cs = document.createElement('span'); renderLatexMixed(cs, mt[2]);
      d.appendChild(ts); d.appendChild(cs);
    } else renderLatexMixed(d, ln);
    el.appendChild(d);
  });
}
function addDays(iso, days){ var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + days); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(function(){ t.hidden = true; }, 2400); }

/* ---------- 进度（与主站共用 localStorage） ---------- */
function loadState(){ try { var raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch(e){} return null; }
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch(e){} }
function qstate(){ return STATE.question_state || (STATE.question_state = {}); }
function notesObj(){ return STATE.notes || (STATE.notes = {}); }
function favs(){ if (!Array.isArray(STATE.favs)) STATE.favs = []; return STATE.favs; }
function isFav(id){ return favs().indexOf(id) >= 0; }
function toggleFav(id){
  var f = favs(), i = f.indexOf(id);
  if (i >= 0) { f.splice(i,1); toast('已取消收藏'); } else { f.push(id); toast('已收藏'); }
  saveState();
}

/* ---------- 掌握状态（照大观园三键） + 错题复测计划 ----------
   done(掌握) / shaky(不熟练→review) / unknown(不会→错题本)
   首次评不熟练/不会：明天起进复测计划
   复测后再评：不会 1/3/7 天，不熟练 2/5/10 天（按复测轮次）
   未到期再评：不重置进度；到期或逾期在任意页面评价都计为当次复测 */
function illGap(r){ return r <= 1 ? 1 : (r === 2 ? 3 : 7); }
function shakyGap(r){ return r <= 1 ? 2 : (r === 2 ? 5 : 10); }
function liveOf(q){ return MARKED[q.id] || (qstate()[q.id] || {}); }
function applyMark(q, kind){
  var s = qstate()[q.id] || {};
  if (kind === 'done') {
    if (s.status === 'done') return;
    qstate()[q.id] = { status:'done', mastery:'done', right_date: TODAY, right_count:(s.right_count||0)+1 };
  } else {
    var dueReached = s.due && s.due <= TODAY;
    var firstTime = !s.wrong_date;
    var b = { status: (kind === 'unknown') ? 'todo' : 'review',
              mastery: kind,
              wrong_date: s.wrong_date || TODAY,
              wrong_count: (s.wrong_count || 0) + (kind === 'unknown' ? 1 : 0),
              shaky_count: (s.shaky_count || 0) + (kind === 'shaky' ? 1 : 0),
              round: s.round || 0 };
    if (s.reason) b.reason = s.reason;
    if (firstTime) { b.due = addDays(TODAY, 1); b.round = 0; }               // 明天起进计划
    else if (dueReached || !s.due) {                                          // 当次复测完成，排下次
      b.round = (s.round || 0) + 1;
      b.due = addDays(TODAY, kind === 'unknown' ? illGap(b.round) : shakyGap(b.round));
    } else { b.due = s.due; }                                                 // 未到期再评：不重置
    qstate()[q.id] = b;
  }
  STATE.papers = STATE.papers || [];
  var rec = { id: 'lx-' + Date.now(), date: TODAY, results: {} };
  rec.results[q.id] = kind;
  STATE.papers.push(rec);
  var keepO = [], keepL = [];
  STATE.papers.forEach(function(x){ (String(x.id||'').indexOf('lx-') === 0 ? keepL : keepO).push(x); });
  STATE.papers = keepO.concat(keepL.slice(-20));
  MARKED[q.id] = qstate()[q.id];
  saveState();
}
function exitRetest(q){
  var s = qstate()[q.id] || {};
  if (!s.wrong_date) return;
  s.due = null; s.out = true;
  qstate()[q.id] = s; MARKED[q.id] = s; saveState();
  toast('已移出复测计划（掌握状态不变）');
}
/* 展示用状态桶 */
function bucket(q){
  var s = liveOf(q);
  if (s.status === 'done') return 'done';
  if (s.status === 'relearn') return 'shaky';
  if (s.status === 'review') return (s.mastery === 'unknown') ? 'unknown' : 'shaky';
  if (s.status === 'todo' && (s.wrong_date || s.due)) return (s.mastery === 'unknown') ? 'unknown' : 'shaky';
  return 'none';
}
function tagOf(q){
  var b = bucket(q), s = liveOf(q);
  if (b === 'done') return '<span class="tag ok">已掌握</span>';
  if (b === 'unknown') return '<span class="tag bad">完全不会</span>';
  if (b === 'shaky') {
    if (s.due && s.due <= TODAY) return '<span class="tag bad">待复测 · ' + s.due + '</span>';
    if (s.due && s.due > TODAY) return '<span class="tag review">复测排期 · ' + s.due + '</span>';
    return '<span class="tag review">不熟练</span>';
  }
  return '<span class="tag">未做</span>';
}

/* ---------- 知识树：挂题 ---------- */
function buildKnowledge(){
  var map = {};
  function walk(n, parent, depth){
    var rec = { id: n.id, name: n.n, ch: n.ch, children: [], parent: parent, depth: depth, qs: [] };
    map[n.id] = rec;
    (n.c || []).forEach(function(c){ rec.children.push(walk(c, rec, depth + 1)); });
    return rec;
  }
  var roots = KN.tree.map(function(r){ return walk(r, null, 0); });
  QS.forEach(function(q){
    var nid;
    if (q.source === 'qhzt') nid = 'qhzt-' + String(q.chapter).replace('专题','');
    else {
      var key = q.source + '|' + (q.kp_sub || '');
      nid = KN.assign[key];
      if (nid === undefined && q.source === 'xian_dai880' && !q.kp_sub) nid = KN.fallback880[q.chapter];
      if (nid === undefined) nid = KN.sources[q.source].root;
    }
    var rec = map[nid];
    if (!rec) rec = map[KN.sources[q.source].root];
    if (rec) rec.qs.push(q);
  });
  /* 子树计数 */
  function roll(rec){
    var total = rec.qs.length;
    rec.children.forEach(function(c){ total += roll(c); });
    rec.total = total;
    return total;
  }
  roots.forEach(roll);
  return { roots: roots, map: map };
}

/* ---------- 目录渲染 ---------- */
function rowHtml(rec, pad){
  var has = rec.total > 0;
  var cls = 'row' + (rec.depth >= 3 ? '' : '') + (has ? '' : ' empty');
  return '<div class="' + cls + '" data-node="' + rec.id + '">' +
    '<span>' + escHtml(rec.name) + '</span>' +
    '<span class="cnt' + (has ? ' has' : '') + '">' + rec.total + '</span></div>';
}
function renderTree(){
  var el = document.getElementById('tree');
  el.innerHTML = '';
  KB.roots.forEach(function(root){
    var det = document.createElement('details');
    det.innerHTML = '<summary class="lv1"><span class="tw">▶</span>' + escHtml(root.name) + '</summary>';
    var box = document.createElement('div'); det.appendChild(box);
    root.children.forEach(function(ch){ box.appendChild(nodeBlock(ch, 1)); });
    el.appendChild(det);
  });
  el.addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if (!row) return;
    var rec = KB.map[row.dataset.node];
    if (!rec) return;
    if (rec.total === 0) { toast('这个知识点下还没有题'); return; }
    openNode(rec);
  });
}
function nodeBlock(rec, lv){
  var det = document.createElement('details');
  var cls = lv === 1 ? 'lv2' : '';
  det.innerHTML = '<summary class="' + cls + '"><span class="tw">▶</span>' + escHtml(rec.name) +
    '<span class="cnt' + (rec.total ? ' has' : '') + '">' + rec.total + '</span></summary>';
  var box = document.createElement('div'); det.appendChild(box);
  if (rec.qs.length) {
    var self = document.createElement('div');
    self.innerHTML = '<div class="row" data-node="' + rec.id + '"><span>『本节整刷』</span><span class="cnt has">' + rec.qs.length + '</span></div>';
    box.appendChild(self.firstChild);
  }
  rec.children.forEach(function(c){
    if (c.children && c.children.length) box.appendChild(nodeBlock(c, lv + 1));
    else box.insertAdjacentHTML('beforeend', rowHtml(c));
  });
  return det;
}

/* ---------- 刷题视图 ---------- */
function openNode(rec){
  CUR_TITLE = pathName(rec);
  CUR_LIST = rec.qs.slice();
  showPractice();
  location.hash = 'n=' + rec.id;
}
function pathName(rec){
  var names = [];
  var r = rec;
  while (r) { names.unshift(r.name); r = r.parent; }
  return names.slice(1).join(' / ') || rec.name;
}
function showPractice(){
  document.getElementById('view-dir').hidden = true;
  document.getElementById('view-retest').hidden = true;
  document.getElementById('view-practice').hidden = false;
  document.getElementById('ptitle').textContent = CUR_TITLE + '（' + CUR_LIST.length + ' 题）';
  renderPractice();
}
function refreshPstats(){
  var done = 0, wrong = 0;
  CUR_LIST.forEach(function(q){ var b = bucket(q); if (b === 'done') done++; else if (b !== 'none') wrong++; });
  document.getElementById('pstats').innerHTML =
    '<div class="stat">共 <b>' + CUR_LIST.length + '</b> 题</div>' +
    '<div class="stat ok">已掌握 <b>' + done + '</b></div>' +
    '<div class="stat rev">有问题 <b>' + wrong + '</b></div>' +
    '<div class="stat">未做 <b>' + (CUR_LIST.length - done - wrong) + '</b></div>' +
    '<div class="bar" style="width:100%"><i style="width:' + (CUR_LIST.length ? Math.round(done / CUR_LIST.length * 100) : 0) + '%"></i></div>';
}
function renderPractice(){
  var list = CUR_LIST.filter(function(q){
    if (P_FILTER === 'todo') return bucket(q) === 'none';
    if (P_FILTER === 'wrong') { var b = bucket(q); return b === 'shaky' || b === 'unknown'; }
    return true;
  });
  document.getElementById('plist').innerHTML = '';
  refreshPstats();
  if (!list.length) { document.getElementById('plist').innerHTML = '<div class="empty">这个筛选下没有题</div>'; return; }
  list.forEach(function(q, i){ document.getElementById('plist').appendChild(card(q, i)); });
}
function card(q, idx){
  var el = document.createElement('div');
  el.className = 'qcard'; el.dataset.qid = q.id;
  var b0 = bucket(q);
  if (b0 === 'done') el.classList.add('done');
  else if (b0 === 'unknown') el.classList.add('unknown');
  else if (b0 === 'shaky') el.classList.add('shaky');
  var lv = liveOf(q);
  var head = '<div class="qhead"><span class="qno">' + (idx + 1) + '</span>' +
    '<span class="tag">' + escHtml(q.chapter_name || q.chapter) + '</span>' +
    (q.type ? '<span class="tag">' + escHtml(q.type) + '</span>' : '') +
    (q.kp_sub && q.source !== 'qhzt' ? '<span class="tag">' + escHtml(q.kp_sub) + '</span>' : '') +
    '<span data-role="st">' + tagOf(q) + '</span>' +
    '<button class="star' + (isFav(q.id) ? ' on' : '') + '" data-role="fav">' + (isFav(q.id) ? '★' : '☆') + '</button></div>';
  var body = '<div class="qtext katex-auto"></div>';
  var replay = '';
  if (lv.wrong_date) replay = '<div class="replay-hint">🔁 复测中 · 首次标记 ' + lv.wrong_date +
    (lv.due ? ' · 下次 ' + lv.due + (lv.due <= TODAY ? '（今日到期）' : '') : (lv.out ? ' · 已移出计划' : '')) + '</div>';
  var instant = q.type === '选择' && /^[A-D]$/.test((q.answer_text || '').trim());
  var radios = instant ? '<div class="radio-row" data-role="radios">' +
    ['A','B','C','D'].map(function(x){ return '<button class="radio-opt" data-v="' + x + '">' + x + '</button>'; }).join('') + '</div>' : '';
  var btns = '<div class="btnrow">' +
    (instant ? '' : '<button class="btn" data-act="ans">看答案</button>') +
    '<button class="btn done" data-act="done">✓ 掌握</button>' +
    '<button class="btn shaky" data-act="shaky">〜 不熟练</button>' +
    '<button class="btn unknown" data-act="unknown">✗ 不会</button></div>';
  var verdict = '<div class="verdict" data-role="verdict"></div>';
  var reasons = '<div class="reasons" data-role="reasons"><span class="rt">补记错因：</span>' +
    ['概念不清','计算失误','方法不会','审题踩坑'].map(function(x){ return '<button class="chip" data-reason="' + x + '">' + x + '</button>'; }).join('') + '</div>';
  var ans = '<div class="ansbox"><div class="at">答案 + 解析</div><div class="ansbody katex-ans"></div><div class="katex-sol"></div></div>';
  var note = '<textarea class="noteta" placeholder="笔记（自动保存）：突破口 / 易错点…">' + escHtml((notesObj()[q.id] || '')) + '</textarea>' +
    '<div class="hint">' + escHtml(q.label || '') + ' · 进度存本机，与主站共用</div>';
  el.innerHTML = head + body + replay + radios + verdict + btns + ans + reasons + note;

  renderLatexMixed(el.querySelector('.katex-auto'), q.question_text || '');
  if (q.question_img) {
    var qi = document.createElement('img');
    qi.className = 'qimg'; qi.loading = 'lazy';
    qi.src = 'data/' + q.question_img; qi.alt = '题目配图';
    qi.onerror = function(){ qi.style.display = 'none'; };
    el.querySelector('.qtext').after(qi);
  }
  /* 答案区 */
  var ansBox = el.querySelector('.ansbox');
  var ab = el.querySelector('.katex-ans');
  if (q.answer_text) renderLatexMixed(ab, q.answer_text); else ab.style.display = 'none';
  var sol = el.querySelector('.katex-sol');
  if (q.solution) formatSolution(sol, q.solution); else sol.style.display = 'none';
  if (q.answer_img) {
    var ai = document.createElement('img');
    ai.className = 'qimg'; ai.loading = 'lazy';
    ai.src = 'data/' + q.answer_img; ai.alt = '答案配图';
    ai.onerror = function(){ ai.style.display = 'none'; };
    ansBox.appendChild(ai);
  }
  if (!q.answer_text && !q.solution && !q.answer_img) {
    ab.style.display = ''; ab.textContent = '题库暂无该题答案文本';
  }

  /* 交互 */
  el.querySelector('[data-role="fav"]').onclick = function(){
    toggleFav(q.id);
    this.classList.toggle('on', isFav(q.id));
    this.textContent = isFav(q.id) ? '★' : '☆';
  };
  var noteTimer = null, ta = el.querySelector('.noteta');
  ta.addEventListener('input', function(){ clearTimeout(noteTimer); noteTimer = setTimeout(function(){ notesObj()[q.id] = ta.value; saveState(); }, 600); });
  if (!instant) {
    el.querySelector('[data-act="ans"]').onclick = function(){ ansBox.classList.toggle('show'); };
  } else {
    /* 选择题点选即判（仅提示，不自动写状态；掌握状态由下方三键决定） */
    var ansLetter = (q.answer_text || '').trim();
    var picked = false;
    el.querySelectorAll('.radio-opt').forEach(function(r){
      r.onclick = function(){
        if (picked) return; picked = true;
        var v = r.dataset.v, vd = el.querySelector('[data-role="verdict"]');
        el.querySelectorAll('.radio-opt').forEach(function(x){
          x.disabled = true;
          if (x.dataset.v === ansLetter) x.classList.add('right');
        });
        if (v === ansLetter) { vd.className = 'verdict ok'; vd.textContent = '回答正确 · 正确答案 ' + ansLetter + '，觉得稳了就点「掌握」'; }
        else {
          r.classList.add('wrongpick');
          vd.className = 'verdict bad'; vd.textContent = '回答错误 · 正确答案 ' + ansLetter + '，建议标「不熟练」或「不会」';
        }
        ansBox.classList.add('show');
      };
    });
  }
  var stEl = el.querySelector('[data-role="st"]');
  ['done','shaky','unknown'].forEach(function(kind){
    el.querySelector('[data-act="' + kind + '"]').onclick = function(){
      applyMark(q, kind);
      var b = bucket(q);
      el.classList.remove('done','shaky','unknown');
      if (b === 'done') el.classList.add('done');
      else if (b === 'unknown') el.classList.add('unknown');
      else if (b === 'shaky') el.classList.add('shaky');
      stEl.innerHTML = tagOf(q);
      el.querySelectorAll('.btnrow .btn').forEach(function(x){ x.classList.remove('on'); });
      this.classList.add('on');
      var rs = el.querySelector('[data-role="reasons"]');
      rs.classList.toggle('show', b !== 'done' && b !== 'none');
      var msgs = { done: '已标记掌握' + (liveOf(q).due ? '' : '，出池'), shaky: '已标记不熟练', unknown: '已加入错题复测' };
      toast(msgs[kind]);
      if (P_FILTER) renderPractice();   /* 筛选视图需剔除已不符的题；默认视图原地更新不跳屏 */
      else refreshPstats();
    };
  });
  el.querySelectorAll('[data-role="reasons"] .chip').forEach(function(c){
    c.onclick = function(){
      var s = qstate()[q.id] || {};
      s.reason = c.dataset.reason;
      qstate()[q.id] = s; MARKED[q.id] = s; saveState();
      toast('错因已记录：' + s.reason);
    };
  });
  return el;
}

/* ---------- 复测视图 ---------- */
var RETEST_SORT = 'due';
function retestLists(){
  var dueList = [], future = [];
  QS.forEach(function(q){
    var s = liveOf(q);
    if (s.status === 'done' || !s.wrong_date) return;
    if (!s.due || s.out) return;
    if (s.due <= TODAY) dueList.push(q); else future.push(q);
  });
  dueList.sort(function(a, b){
    var sa = liveOf(a), sb = liveOf(b);
    return RETEST_SORT === 'due' ? sa.due.localeCompare(sb.due) : (sb.wrong_date || '').localeCompare(sa.wrong_date || '');
  });
  future.sort(function(a, b){ return liveOf(a).due.localeCompare(liveOf(b).due); });
  return { dueList: dueList, future: future };
}
function showRetest(){
  document.getElementById('view-dir').hidden = true;
  document.getElementById('view-practice').hidden = true;
  document.getElementById('view-retest').hidden = false;
  location.hash = 'retest';
  var r = retestLists();
  document.getElementById('restats').innerHTML =
    '<div class="stat bad">待复测 <b>' + r.dueList.length + '</b></div>' +
    '<div class="stat">未来排期 <b>' + r.future.length + '</b></div>';
  var rel = document.getElementById('relist'); rel.innerHTML = '';
  if (!r.dueList.length) rel.innerHTML = '<div class="empty">当前没有待复测题，到期的题会自动出现在这里</div>';
  r.dueList.forEach(function(q){
    var d = document.createElement('div');
    d.className = 'due-item';
    var s = liveOf(q);
    d.innerHTML = '<span class="d">' + (s.due < TODAY ? '逾期 ' : '今日到期 ') + '</span>' +
      '<span>' + escHtml(q.label || q.id) + '</span>' +
      '<span class="tag">' + escHtml((q.chapter_name || '').slice(0, 14)) + '</span>' +
      '<button class="btn" style="margin-left:auto;padding:3px 10px;font-size:12px">去复测</button>';
    d.querySelector('button').onclick = function(){
      CUR_TITLE = '错题复测 · ' + q.label; CUR_LIST = r.dueList.slice();
      showPractice();
      setTimeout(function(){
        var el = document.querySelector('.qcard[data-qid="' + CSS.escape(q.id) + '"]');
        if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.style.outline = '2px solid #2f6bff'; setTimeout(function(){ el.style.outline=''; }, 1600); }
      }, 60);
    };
    rel.appendChild(d);
  });
  var ph = document.getElementById('plan-head'), pl = document.getElementById('planlist');
  ph.hidden = !r.future.length; pl.innerHTML = '';
  r.future.forEach(function(q){
    var d = document.createElement('div');
    d.className = 'due-item';
    var s = liveOf(q);
    d.innerHTML = '<span class="d future">第 ' + ((s.round || 0) + 1) + ' 次 · ' + s.due + '</span>' +
      '<span>' + escHtml(q.label || q.id) + '</span>' +
      '<button class="btn" style="margin-left:auto;padding:3px 10px;font-size:12px">提前刷</button>' +
      '<button class="btn" style="padding:3px 10px;font-size:12px">移出</button>';
    d.querySelectorAll('button')[0].onclick = function(){
      CUR_TITLE = '提前刷 · ' + q.label; CUR_LIST = [q];
      showPractice();
    };
    d.querySelectorAll('button')[1].onclick = function(){ exitRetest(q); showRetest(); };
    pl.appendChild(d);
  });
}

/* ---------- 特殊列表 ---------- */
function openFavs(){
  var list = favs().map(function(id){ return QMAP[id]; }).filter(Boolean);
  CUR_TITLE = '⭐ 我的收藏'; CUR_LIST = list;
  showPractice();
  location.hash = 'favs';
}
function openRetestRun(list, title){
  CUR_TITLE = title; CUR_LIST = list;
  showPractice();
}

/* ---------- 全局统计 ---------- */
function globalStats(){
  var done = 0, shaky = 0, unknown = 0;
  QS.forEach(function(q){
    var b = bucket(q);
    if (b === 'done') done++; else if (b === 'shaky') shaky++; else if (b === 'unknown') unknown++;
  });
  return { done: done, shaky: shaky, unknown: unknown, none: QS.length - done - shaky - unknown };
}

/* ---------- 启动 ---------- */
function start(){
  KB = buildKnowledge();
  document.getElementById('dirstats').innerHTML = (function(){
    var g = globalStats();
    return '<div class="stat">题库 <b>' + QS.length + '</b></div>' +
      '<div class="stat ok">已掌握 <b>' + g.done + '</b></div>' +
      '<div class="stat rev">不熟练 <b>' + g.shaky + '</b></div>' +
      '<div class="stat bad">不会 <b>' + g.unknown + '</b></div>' +
      '<div class="stat">未做 <b>' + g.none + '</b></div>';
  })();
  renderTree();
  document.getElementById('btn-retest').onclick = showRetest;
  document.getElementById('btn-favs').onclick = openFavs;
  document.getElementById('btn-back').onclick = goDir;
  document.getElementById('btn-back2').onclick = goDir;
  document.querySelectorAll('#pfilter .chip').forEach(function(c){
    c.onclick = function(){
      P_FILTER = c.dataset.f;
      document.querySelectorAll('#pfilter .chip').forEach(function(x){ x.classList.toggle('on', x === c); });
      renderPractice();
    };
  });
  document.querySelectorAll('[data-sort]').forEach(function(c){
    c.onclick = function(){
      RETEST_SORT = c.dataset.sort;
      document.querySelectorAll('[data-sort]').forEach(function(x){ x.classList.toggle('on', x === c); });
      showRetest();
    };
  });
  /* 深链 */
  var h = location.hash.slice(1);
  if (h === 'retest') showRetest();
  else if (h === 'favs') openFavs();
  else if (h.indexOf('n=') === 0) {
    var nid = decodeURIComponent(h.slice(2));
    var rec = KB.map[nid] || KB.map[Number(nid)];
    if (rec) openNode(rec);
  }
}
function goDir(){
  document.getElementById('view-practice').hidden = true;
  document.getElementById('view-retest').hidden = true;
  document.getElementById('view-dir').hidden = false;
  if (location.hash) history.pushState('', '', location.pathname);
  renderTree();
}
function countdown(){
  var ms = new Date(EXAM + 'T00:00:00') - new Date(TODAY + 'T00:00:00');
  var n = Math.round(ms / 86400000);
  if (n >= 0) document.getElementById('cd').textContent = '距考研初试 ' + n + ' 天';
}
var KB = null;

Promise.all([
  fetch('data/questions.json').then(function(r){ return r.json(); }),
  fetch('data/knowledge.json').then(function(r){ return r.json(); })
]).then(function(res){
  QS = res[0]; KN = res[1];
  QS.forEach(function(q){ QMAP[q.id] = q; });
  STATE = loadState();
  if (!STATE) {
    fetch('data/progress.json').then(function(r){ return r.json(); }).then(function(p){
      STATE = (p && typeof p === 'object') ? p : { papers: [], notes: {}, question_state: {} };
      if (!STATE.question_state) STATE.question_state = {};
      if (!STATE.notes) STATE.notes = {};
      if (!STATE.papers) STATE.papers = [];
      saveState(); start();
    }).catch(function(){ STATE = { papers: [], notes: {}, question_state: {} }; saveState(); start(); });
  } else start();
  countdown();
});
})();
</script>
