<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>801 真题错题 · 1998—2025</title>
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root { --blue:#123a8f; --red:#b3261e; --green:#0c5c46; --orange:#ff7d1a; --ink:#1c2330; --line:#dfe4ee; }
  * { box-sizing:border-box; }
  html,body{overflow-x:hidden}
  body { margin:0; background:#f6f7fb; color:var(--ink);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
         font-size:16.5px; line-height:1.7; }
  .wrap { max-width:720px; margin:0 auto; padding:14px 14px 60px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  h1 { font-size:21px; color:var(--blue); margin:4px 0 0; }
  .back { font-size:13.5px; color:#5a6472; text-decoration:none; flex:0 0 auto; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px; }
  .chip { background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px 12px; font-size:13px; color:#3c4657; }
  .chip b { color:var(--red); }
  .fchips { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 2px; }
  .fchips button { border:1px solid var(--line); background:#fff; border-radius:999px;
                   padding:4px 14px; font-size:13.5px; cursor:pointer; color:#5a6472; }
  .fchips button.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-top:10px; }
  .ycard { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px; cursor:pointer;
           transition:transform .15s, box-shadow .15s; }
  .ycard:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(35,50,90,.10); }
  .ycard .y { font-size:18px; font-weight:800; color:var(--blue); }
  .ycard .m { font-size:12.5px; color:#7a828f; margin-top:4px; }
  .ycard .bad { color:var(--red); font-weight:700; }
  .ycard .todo { color:var(--orange); font-weight:700; }
  .pbar { height:6px; background:#e8ebf2; border-radius:99px; overflow:hidden; margin-top:8px; }
  .pbar i { display:block; height:100%; background:#3d5aa9; border-radius:99px; }
  .q { background:#fff; border:1px solid var(--line); border-radius:12px; margin:10px 0; overflow:hidden; }
  .qhead { display:flex; align-items:center; gap:9px; padding:10px 13px; cursor:pointer; }
  .qhead .no { flex:1; min-width:0; font-weight:600; font-size:15px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qbody { border-top:1px solid var(--line); padding:6px 14px 12px; }
  .stc { font-size:12px; border-radius:6px; padding:1.5px 8px; font-weight:700; white-space:nowrap; }
  .stc.ok { background:#e8f7f0; color:#1d9e6f; }
  .stc.half { background:#fff4e0; color:#b26a00; }
  .stc.bad { background:#fdeaea; color:#c0504d; }
  .stc.none { background:#f0f2f6; color:#98a0ad; }
  .stem { font-size:15.5px; }
  .stem p { margin:.5em 0; }
  .item { background:#f8faff; border:1px solid #dbe6fa; border-radius:10px; padding:9px 12px; margin:10px 0; }
  .item .ilab { font-size:12.5px; color:var(--blue); font-weight:700; margin-bottom:4px; }
  .item .stem { margin:2px 0 6px; }
  .item .kd { position:relative; }
  .item .kd.blurred .inner { filter:blur(7px); user-select:none; }
  .item .inner { transition:filter .25s; font-size:15px; }
  .item .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                font-size:13.5px; color:#8a94a6; cursor:pointer; background:#f8faffbb; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:9px; }
  .btns button { border:1.5px solid var(--line); background:#fff; border-radius:9px;
                 padding:4px 13px; font-size:13.5px; cursor:pointer; color:var(--ink); }
  .btns button.on-ok { background:var(--green); border-color:var(--green); color:#fff; }
  .btns button.on-half { background:#ff9800; border-color:#ff9800; color:#fff; }
  .btns button.on-bad { background:var(--red); border-color:var(--red); color:#fff; }
  .btns button.small { padding:3px 11px; font-size:13px; }
  .reasons { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
  .reasons button { border:1px solid var(--line); background:#fff; border-radius:999px;
                    padding:2px 11px; font-size:12.5px; cursor:pointer; color:#5a6472; }
  .reasons button.on { background:#fdeaea; border-color:#f2c4c0; color:var(--red); font-weight:700; }
  .reasonbox textarea { width:100%; min-height:46px; border:1px solid var(--line); border-radius:9px;
                        padding:7px 10px; font-size:13.5px; font-family:inherit; resize:vertical; }
  .metabar { font-size:12px; color:#8a94a6; margin-top:6px; }
  .notice { background:#fff7e8; border:1px solid #f0dfb8; border-radius:10px; padding:8px 13px;
            font-size:14px; margin:10px 0; }
  .notice.red { background:#fdecec; border-color:#f2c4c0; }
  .notice.blue { background:#eaf1ff; border-color:#c9d6f2; }
  .tip { background:#fff7e8; border:1px solid #f0dfb8; border-radius:10px; padding:8px 13px; font-size:14px; margin-top:10px; }
  .foot { text-align:center; color:#8a94a6; font-size:12.5px; margin-top:24px; }
  .empty { text-align:center; color:#8a94a6; padding:30px 0; }
  @media (max-width:520px){ body{font-size:15.5px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>801 真题错题 · 1998—2025</h1>
    <a class="back" href="index.html">← 返回主站</a>
  </div>
  <div class="chips" id="statchips"></div>
  <div class="fchips" id="filters" hidden>
    <button data-f="all" class="on">全部</button>
    <button data-f="bad">只看错题</button>
    <button data-f="none">只看未标</button>
    <button data-f="redo">只看待重做</button>
  </div>
  <div id="app"><div class="empty">加载中…</div></div>

  <div class="tip"><b>用法</b>:点年份进卷册 → 展开大题看题面自己作答 → 逐小题(第1空/第1题…)标 <b>会 / 半会 / 错</b>,标错的记错因、点重做打卡;<b>看精解</b>默认打码防偷瞄;整道大题重做过关后逐项点「已掌握」归档。<br>
  状态存本机浏览器,换设备前先去「全站备份」打包。</div>
  <div class="foot">801 真题错题模块 ｜ 数据:data/zhenti801.json(28 年 251 大题 · 707 追踪项,精解由 ZCode 维护) ｜ 状态:z801_state_v1</div>
</div>

<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
<script src="marked/marked.min.js"></script>
<script>
'use strict';
const LS_KEY = 'z801_state_v1';
let DATA = null, YMAP = {}, QMAP = {}, STATE = {};
let curYear = 0, filter = 'all';

const $ = s => document.querySelector(s);
function loadState(){ try { STATE = JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ STATE = {}; } }
function saveState(){ try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch(e){} }
const stOf = sid => STATE[sid] || null;
const isBad = s => !!s && (s.st === 'bad' || s.st === 'half');
function todayISO(){ const d = new Date(); const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }

/* 大题 → 追踪项列表(有小题拆小题,无小题整题一项) */
function itemsOf(q){
  if (q.subs && q.subs.length >= 2)
    return q.subs.map(s => ({ sid: q.id + '#' + s.n, label: s.t || ('第' + s.n + s.k), stem: s.stem || '', key: s.key || '' }));
  return [{ sid: q.id, label: '精解', stem: '', key: q.key }];
}
function secState(q){  // 大题聚合: {ok,half,bad,none,n,marked}
  const items = itemsOf(q);
  const r = { ok: 0, half: 0, bad: 0, none: 0, n: items.length, marked: 0 };
  items.forEach(it => {
    const s = stOf(it.sid);
    if (!s){ r.none++; return; }
    r.marked++;
    if (s.st === 'ok') r.ok++;
    else if (s.st === 'half') r.half++;
    else r.bad++;
  });
  return r;
}
function secChip(q){
  const r = secState(q);
  if (r.none === r.n) return `<span class="stc none">未标 0/${r.n}</span>`;
  if (r.bad > 0) return `<span class="stc bad">✗ 错 ${r.bad} 项 · 已标 ${r.marked}/${r.n}</span>`;
  if (r.half > 0) return `<span class="stc half">△ 半会 ${r.half} · 已标 ${r.marked}/${r.n}</span>`;
  return `<span class="stc ok">✓ 全部会 ${r.marked}/${r.n}</span>`;
}

function mdInto(el, mdText){
  el.innerHTML = marked.parse(mdText || '');
  if (window.renderMathInElement)
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
        {left: '$', right: '$', display: false}
      ],
      throwOnError: false
    });
}

/* —— 统计 —— */
function allYears(){ return DATA.years; }
function stats(){
  let marked = 0, bad = 0, todo = 0, total = 0;
  allYears().forEach(y => y.qs.forEach(q => itemsOf(q).forEach(it => {
    total++;
    const s = stOf(it.sid);
    if (s) marked++;
    if (isBad(s)){ bad++; if (!s.rs || !s.rs.length) todo++; }
  })));
  return { total, marked, bad, todo };
}
function yearStats(y){
  let marked = 0, bad = 0, todo = 0, n = 0;
  y.qs.forEach(q => itemsOf(q).forEach(it => {
    n++;
    const s = stOf(it.sid);
    if (s) marked++;
    if (isBad(s)){ bad++; if (!s.rs || !s.rs.length) todo++; }
  }));
  return { n, marked, bad, todo };
}
function statChipsHTML(){
  const st = stats();
  return `<span class="chip">追踪项 <b>${st.total}</b></span>` +
    `<span class="chip">已标 ${st.marked}</span>` +
    `<span class="chip">错题 <b>${st.bad}</b></span>` +
    `<span class="chip">待重做 <b>${st.todo}</b></span>`;
}

/* —— 卷册总览 —— */
function vHome(){
  $('#statchips').innerHTML = statChipsHTML();
  let h = '';
  DATA.years.forEach(y => {
    const s = yearStats(y);
    h += `<div class="ycard" data-year="${y.year}">
      <div class="y">${y.year}</div>
      <div class="m">${s.n} 项 · 已标 ${s.marked} · <span class="bad">错 ${s.bad}</span>${s.todo ? ` · <span class="todo">待重做 ${s.todo}</span>` : ''}</div>
      <div class="pbar"><i style="width:${s.n ? Math.round(s.marked / s.n * 100) : 0}%"></i></div>
    </div>`;
  });
  $('#app').innerHTML = `<div class="grid">${h}</div>`;
  $('#app').querySelectorAll('[data-year]').forEach(el =>
    el.addEventListener('click', () => { curYear = +el.dataset.year; filter = 'all'; render(); window.scrollTo(0, 0); }));
  $('#filters').hidden = true;
}

/* —— 卷册详情 —— */
function passFilter(sid){
  const s = stOf(sid);
  if (filter === 'bad') return isBad(s);
  if (filter === 'none') return !s;
  if (filter === 'redo') return isBad(s) && (!s.rs || !s.rs.length);
  return true;
}
function secPass(q){ return itemsOf(q).some(it => passFilter(it.sid)); }

function vYear(){
  const y = YMAP[curYear];
  if (!y){ vHome(); return; }
  $('#statchips').innerHTML = statChipsHTML();
  $('#filters').hidden = false;
  const qs = y.qs.filter(secPass);
  let h = `<div class="notice blue"><b>${y.year} 年</b> · ${y.qs.length} 大题 ｜ ${y.brief.slice(0, 60)}${y.brief.length > 60 ? '…' : ''}
    　<a href="#" id="backhome" style="color:var(--blue)">← 全部年份</a></div>`;
  if (!qs.length) h += `<div class="empty">该筛选下没有题目</div>`;
  qs.forEach(q => {
    h += `<div class="q" data-q="${q.id}">
      <div class="qhead" data-toggle="${q.id}"><span class="no">${q.no}</span>${secChip(q)}<span style="color:#98a0ad">▾</span></div>
      <div class="qbody" hidden></div>
    </div>`;
  });
  $('#app').innerHTML = h;

  $('#backhome').addEventListener('click', e => { e.preventDefault(); curYear = 0; filter = 'all'; render(); window.scrollTo(0, 0); });
  $('#app').querySelectorAll('[data-toggle]').forEach(el =>
    el.addEventListener('click', () => {
      const box = el.parentElement.querySelector('.qbody');
      if (box.hidden){ box.hidden = false; fillQuestion(box, QMAP[el.dataset.toggle].q); }
      else { box.hidden = true; box.innerHTML = ''; }
    }));
}

/* 单个追踪项块:label + 精解(打码) + 三态 + 错因 + 重做/归档 */
function itemBlock(sid, label, stem, key){
  const s = stOf(sid) || {};
  const st = s.st || '', reason = s.reason || '', rs = s.rs || [];
  const REASONS = ['概念不清', '公式记错', '计算失误', '思路错误', '审题失误', '没时间'];
  let h = `<div class="item" data-item="${sid}">
    <div class="ilab">${label}${st ? '' : ' · 未标'}</div>`;
  if (stem) h += `<div class="stem istem" data-stem="${sid}"></div>`;
  if (key) h += `<div class="kd ${st ? '' : 'blurred'}"><div class="inner" data-md="${sid}"></div>
      ${st ? '' : '<div class="hint">🔒 精解已打码 · 先自己作答,标完点这里核对</div>'}</div>`;
  h += `<div class="btns">
      <button data-st="ok" class="${st === 'ok' ? 'on-ok' : ''}">✓ 会</button>
      <button data-st="half" class="${st === 'half' ? 'on-half' : ''}">△ 半会</button>
      <button data-st="bad" class="${st === 'bad' ? 'on-bad' : ''}">✗ 错</button>
      ${isBad(s) ? `<button data-act="redo" class="small blue">🔁 重做打卡${rs.length ? '(' + rs.length + '次·最近' + rs[rs.length - 1].slice(5) + ')' : ''}</button>
      <button data-act="master" class="small blue">✓ 已掌握(归档)</button>` : ''}
    </div>`;
  if (!stem && !key) h += `<div class="metabar">(本题内容见上方题面)</div>`;
  if (isBad(s)){
    h += `<div class="reasons">${REASONS.map(r =>
      `<button data-rs="${r}" class="${reason === r ? 'on' : ''}">${r}</button>`).join('')}</div>
      <div class="reasonbox" style="margin-top:7px"><textarea placeholder="补充错因/卡壳点(可选)…">${reason && !REASONS.includes(reason) ? reason : ''}</textarea></div>
      <div class="metabar">重做 ${rs.length} 次${rs.length ? ' · 最近 ' + rs[rs.length - 1] : ' · 还没重做过'}</div>`;
  }
  return h + `</div>`;
}
function bindItem(box, it){
  const sid = it.sid;
  const el = box.querySelector(`[data-item="${CSS.escape(sid)}"]`);
  if (!el) return;
  const stemEl = el.querySelector('.stem');
  if (stemEl) mdInto(stemEl, it.stem);
  const kd = el.querySelector('.kd');
  if (kd){
    mdInto(kd.querySelector('.inner'), it.key);
    if (kd.classList.contains('blurred'))
      el.querySelector('.hint').addEventListener('click', () => {
        kd.classList.remove('blurred');
        const h = el.querySelector('.hint'); if (h) h.remove();
      });
  }
  el.querySelectorAll('[data-st]').forEach(btn =>
    btn.addEventListener('click', () => {
      const v = btn.dataset.st, rec = STATE[sid] || {};
      if (rec.st === v) delete STATE[sid];
      else { rec.st = v; STATE[sid] = rec; }
      saveState(); fillQuestion(box, QMAP[box.dataset.q].q);
    }));
  el.querySelectorAll('[data-rs]').forEach(btn =>
    btn.addEventListener('click', () => {
      const rec = STATE[sid] || (STATE[sid] = {});
      rec.reason = rec.reason === btn.dataset.rs ? '' : btn.dataset.rs;
      saveState(); fillQuestion(box, QMAP[box.dataset.q].q);
    }));
  const ta = el.querySelector('textarea');
  if (ta) ta.addEventListener('change', () => {
    const rec = STATE[sid] || (STATE[sid] = {});
    rec.reason = ta.value.trim(); saveState();
  });
  const redo = el.querySelector('[data-act="redo"]');
  if (redo) redo.addEventListener('click', () => {
    const rec = STATE[sid] || (STATE[sid] = {});
    rec.rs = rec.rs || []; rec.rs.push(todayISO());
    saveState(); fillQuestion(box, QMAP[box.dataset.q].q);
  });
  const master = el.querySelector('[data-act="master"]');
  if (master) master.addEventListener('click', () => {
    const rec = STATE[sid] || (STATE[sid] = {});
    rec.st = 'ok'; saveState(); fillQuestion(box, QMAP[box.dataset.q].q);
  });
}

function fillQuestion(box, q){
  box.dataset.q = q.id;
  const items = itemsOf(q);
  let h = `<div class="stem" id="stem-${q.id}"></div>`;
  items.forEach(it => { h += itemBlock(it.sid, it.label, it.stem, it.key); });
  box.innerHTML = h;
  box.dataset.q = q.id;
  mdInto(box.querySelector('#stem-' + q.id), q.stem);
  items.forEach(it => bindItem(box, it));
  refreshChips();
}
function refreshChips(){
  $('#statchips').innerHTML = statChipsHTML();
}

/* —— 渲染入口 —— */
function render(){
  if (curYear) vYear(); else vHome();
}

async function init(){
  loadState();
  try {
    const r = await fetch('data/zhenti801.json?' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
  } catch(e){
    $('#app').innerHTML = '<div class="notice red">数据加载失败,请联网后刷新重试。</div>';
    return;
  }
  DATA.years.forEach(y => {
    YMAP[y.year] = y;
    y.qs.forEach(q => QMAP[q.id] = { y: y.year, q });
  });
  render();

  $('#filters').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => {
      filter = b.dataset.f;
      $('#filters').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      render();
    }));
}
init();
</script>
</body>
</html>
