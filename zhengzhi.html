<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>政治一页纸 · 背诵</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f6f1ea;color:#333;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:10;background:#7a1f1f;color:#fff;padding:10px 14px 8px}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brand{font-size:17px;font-weight:800;white-space:nowrap}
.brand .sub{font-size:11.5px;opacity:.85;margin-left:5px;font-weight:400}
#dayinfo{font-size:12px;text-align:right;white-space:nowrap;flex-shrink:0}
#dayinfo b{font-size:13px}
nav{display:flex;gap:6px;margin-top:8px}
nav button{flex:1;border:0;background:rgba(255,255,255,.16);color:#fff;padding:7px 0;border-radius:8px;font-size:14px;cursor:pointer}
nav button.on{background:#fff;color:#7a1f1f;font-weight:700}
main{max-width:720px;margin:0 auto;padding:12px 12px 40px}
.rulebar{background:#fff7e8;border:1px solid #f0dfc0;color:#8a6d3b;font-size:12.5px;padding:8px 10px;border-radius:8px;margin-bottom:4px;line-height:1.5}
.daynote{background:#eef4fb;border:1px solid #d5e3f5;color:#3d5a80;font-size:12.5px;padding:8px 10px;border-radius:8px;margin:6px 0 2px;line-height:1.5}
.qhead{display:flex;align-items:center;margin:16px 2px 8px}
.qhead b{font-size:15px;white-space:nowrap}
.qhead .cnt{margin-left:8px;font-size:12px;color:#999;white-space:nowrap}
.pbar{flex:1;height:6px;background:#e8ded2;border-radius:3px;margin-left:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:#4caf7d;border-radius:3px;transition:width .3s}
.row{background:#fff;border:1px solid #e5dbcf;border-radius:10px;margin-bottom:8px;overflow:hidden}
.rowhead{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer}
.chip{min-width:38px;text-align:center;background:#f3ead9;color:#7a5c2e;border-radius:6px;font-size:11.5px;padding:2px 4px;font-weight:700;flex-shrink:0}
.rtitle{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rflags{font-size:11px;white-space:nowrap;display:flex;gap:4px;align-items:center}
.badge{border-radius:5px;padding:1px 5px;font-size:11px}
.b-new{background:#e8f0ff;color:#275bd1}.b-due{background:#fff3e0;color:#d16056}
.b-grad{background:#e6f6ec;color:#2e8b57}.b-weak{background:#fdeaea;color:#c0392b}
.b-plan{background:#f1ead8;color:#8a6d3b}
.cardbody{border-top:1px dashed #e5dbcf;padding:10px 12px 12px;display:none;background:#fffdf8}
.row.open .cardbody{display:block}
.bl{font-size:15px;line-height:1.7;margin-bottom:2px;font-weight:600}
.bl.p1{margin-top:10px}
.seg{white-space:pre-wrap}
.seg.h{border-radius:3px;padding:0 2px}
.ratebar{display:flex;gap:8px;margin-top:14px}
.ratebar button{flex:1;border:0;border-radius:8px;padding:11px 0;font-size:14px;font-weight:700;cursor:pointer}
.rb0{background:#fdecea;color:#c0392b}.rb1{background:#fff4e0;color:#b8860b}.rb2{background:#e6f6ec;color:#2e8b57}
.norate .ratebar{display:none}
.modebar{display:flex;gap:6px;margin:8px 0 2px}
.modebar button{flex:1;border:1px solid #e0d5c5;background:#fff;border-radius:8px;padding:8px 0;font-size:13px;color:#8a7a60;cursor:pointer}
.modebar button.on{background:#7a1f1f;border-color:#7a1f1f;color:#fff;font-weight:700}
.qq{font-size:15.5px;font-weight:700;line-height:1.6;margin:2px 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid #e5dbcf;background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.5;cursor:pointer;color:#444}
.opt:disabled{cursor:default;opacity:.72}
.opt.correct{border-color:#2e8b57;background:#e6f6ec;color:#1d6b40;font-weight:700;opacity:1}
.opt.wrong{border-color:#c0392b;background:#fdeaea;color:#a93226;opacity:1}
.good{color:#2e8b57;font-weight:700}
.bad{color:#c0392b;font-weight:700}
.quizfb{margin-top:10px;font-size:13.5px}
.fbcard{background:#fff;border:1px dashed #e0d5c5;border-radius:8px;padding:8px;margin-top:8px}
.skipwrap{margin-top:10px}
.skipwrap button{width:100%;border:0;border-radius:8px;padding:10px 0;font-size:13.5px;font-weight:700;cursor:pointer}
.blk{display:inline-block;background:#efe8db;border-bottom:2px solid #b8a88f;border-radius:4px;padding:0 10px;margin:0 1px;cursor:pointer;color:#9b8d76;user-select:none}
.blk.rv{background:rgba(0,0,0,0.04);border-bottom-color:transparent}
.alldone{background:#e6f6ec;border:1px solid #bfe6cf;color:#2e8b57;border-radius:10px;padding:16px;text-align:center;font-size:15px;font-weight:700;margin-top:14px}
#search{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:6px;background:#fff}
.grp{margin-bottom:6px}
.grp>h3{font-size:13.5px;color:#7a1f1f;border-left:3px solid #7a1f1f;padding-left:8px;margin:12px 0 8px;cursor:pointer}
.statcard{background:#fff;border:1px solid #e5dbcf;border-radius:10px;padding:12px;margin-bottom:10px;font-size:13.5px}
.statcard h3{font-size:14px;margin-bottom:8px;color:#7a1f1f}
.big{font-size:22px;font-weight:800;color:#7a1f1f}
.cal{display:flex;gap:4px}
.cal .d{flex:1 1 0;min-width:28px;text-align:center;font-size:10px;padding:6px 0;border-radius:6px;background:#f3ead9;color:#8a6d3b}
.cal .d b{display:block;font-size:13px}
.cal .d.today{outline:2px solid #7a1f1f;font-weight:700}
.plantable{width:100%;border-collapse:collapse;font-size:12.5px}
.plantable td,.plantable th{padding:5px 6px;border-bottom:1px solid #f0e8dc;text-align:left;vertical-align:top}
.plantable tr.today td{background:#fff7e8;font-weight:700}
.plantable .note{color:#999;font-size:11.5px}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips span{background:#fdeaea;color:#c0392b;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.muted{color:#999;font-size:12px}
.btnrow{display:flex;gap:8px;margin-top:6px}
.btnrow button{flex:1;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 0;font-size:12.5px;color:#666;cursor:pointer}
.hidden{display:none}
footer{max-width:720px;margin:0 auto;padding:0 12px 30px;color:#b0a79a;font-size:11.5px;text-align:center}
</style>
</head>

    <div id="browsebody"></div>
  </section>
  <section id="tab-stats" class="hidden"><div id="statsbody"></div></section>
</main>

const NGRAY = new Set(["#ff0000", "#009fff", "#ff6000", "#8000ff", "#ff00bf", "#df00ff", "#dc7705", "#eb9e27", "#178344", "#2000ff", "#275bd1", "#0040ff"]);
const GROUP_OF = {};
D.GROUPS.forEach((g, gi) => g.ids.forEach(id => GROUP_OF[id] = gi));
const QAPOOL = {};
for (const id in U) (U[id].qa || []).forEach(p => {
  const g = GROUP_OF[id] === undefined ? -1 : GROUP_OF[id];
  (QAPOOL[g] = QAPOOL[g] || []).push({ a: p[1], g });
});
const OTHERPOOL = [];
Object.keys(QAPOOL).forEach(k => { if (true) OTHERPOOL.push(...QAPOOL[k]); });
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let MODE = localStorage.getItem("zzbs_mode") || "recite";

let S;
try { S = JSON.parse(localStorage.getItem("zzbs_v1")); } catch (e) { S = null; }
if (!S || !S.anchor) { S = { anchor: todayStr(), units: {}, log: {} }; persist(); }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function persist() { localStorage.setItem("zzbs_v1", JSON.stringify(S)); }
function dayIndex() { const a = new Date(S.anchor + "T00:00:00"), t = new Date(todayStr() + "T00:00:00"); return Math.max(1, Math.round((t - a) / 864e5) + 1); }
const DI = dayIndex();
const ROUND = Math.ceil(DI / 10);
const DAY = ((DI - 1) % 10) + 1;

const PLAN_DAY = {};
for (const d in MAIN) MAIN[d].forEach(id => { if (!(id in PLAN_DAY)) PLAN_DAY[id] = +d; });
for (const d in MEET) MEET[d].forEach(id => { if (!(id in PLAN_DAY)) PLAN_DAY[id] = +d; });

function stOf(id) { return S.units[id] || (S.units[id] = {}); }
function inNew(id) {
  if (PLAN_DAY[id] > DAY) return false;
  const st = S.units[id];
  return !st || !st.intro || st.seenRound < ROUND;
}
let Q = null, Q0 = null;
function buildQueues() {
  const review = [], newq = [], meet = [], seen = new Set();
  for (const id in S.units) {
    const st = S.units[id];
    if (st.intro && !st.grad && st.due && st.due <= DI && U[id]) { review.push(id); seen.add(id); }
  }
  review.sort((a, b) => S.units[a].due - S.units[b].due);
  for (let d = 1; d <= DAY; d++) (MAIN[d] || []).forEach(id => { if (inNew(id) && !seen.has(id)) { newq.push(id); seen.add(id); } });
  for (let d = 1; d <= DAY; d++) (MEET[d] || []).forEach(id => { if (inNew(id) && !seen.has(id)) { meet.push(id); seen.add(id); } });
  Q = { review, newq, meet };
  Q0 = { review: review.length, newq: newq.length, meet: meet.length };
}

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function bodyHTML(u) {
  return u.lines.map(ln => {
    const ml = ln[0], par = ln[1], segs = ln[2], bg = ln[3] || "";
    const inner = segs.map(s => {
      let st = "color:" + s[1];
      if (s[2]) st += ";border-bottom:2px solid " + s[2];
      if (s[3]) st += ";background:" + s[3];
      const cls = "seg" + (s[3] ? " h" : "");
      return '<span class="' + cls + '" style="' + st + '">' + esc(s[0]) + "</span>";
    }).join("");
    const stl = 'margin-left:' + Math.round(ml * 0.9) + 'px;' + (bg ? 'background:' + bg + ';border-radius:4px;' : '');
    return '<div class="bl' + (par ? " p1" : "") + '" style="' + stl + '">' + inner + "</div>";
  }).join("");
}
function escA(t) { return esc(t).replace(/"/g, "&quot;"); }
function clozeHTML(u) {
  let n = 0;
  const body = u.lines.map(ln => {
    const segs = ln[2];
    const lineText = segs.map(s => s[0]).join("");
    const isStem = /：\s*$/.test(lineText) || lineText.trim() === u.title.trim();
    const single = segs.length === 1 && lineText.trim().length <= 24;
    const flags = segs.map(s => !isStem && (ACCENT.has(s[1]) || (single && NGRAY.has(s[1]))));
    const parts = [];
    let i = 0;
    while (i < segs.length) {
      if (!flags[i]) {
        const s = segs[i];
        let st = "color:" + s[1];
        if (s[2]) st += ";border-bottom:2px solid " + s[2];
        if (s[3]) st += ";background:" + s[3];
        parts.push('<span class="seg" style="' + st + '">' + esc(s[0]) + "</span>");
        i++;
      } else {
        let j = i, txt = "";
        while (j < segs.length && flags[j]) { txt += segs[j][0]; j++; }
        parts.push('<span class="blk" data-t="' + escA(txt) + '" data-c="' + segs[i][1] + '">＿＿＿＿</span>');
        n++;
        i = j;
      }
    }
    const stl = "margin-left:" + Math.round(ln[0] * 0.9) + "px;" + (ln[3] ? "background:" + ln[3] + ";border-radius:4px;" : "");
    return '<div class="bl' + (ln[1] ? " p1" : "") + '" style="' + stl + '">' + parts.join("") + "</div>";
  }).join("");
  return body + (n ? '<div class="skipwrap"><button class="rb1 revall" style="background:#fff4e0;color:#b8860b">👀 全部显示</button></div>' : "");
}
function makeOpts(id, correct) {
  const g = GROUP_OF[id];
  const nk = correct.replace(/\s/g, "");
  const ds = [], seen = new Set([nk]);
  const same = shuffle(QAPOOL[g] || []);
  for (const c of same) {
    const k = c.a.replace(/\s/g, "");
    if (seen.has(k)) continue;
    seen.add(k); ds.push(c.a);
    if (ds.length === 3) break;
  }
  if (ds.length < 3) for (const c of shuffle(OTHERPOOL)) {
    const k = c.a.replace(/\s/g, "");
    if (seen.has(k)) continue;
    seen.add(k); ds.push(c.a);
    if (ds.length === 3) break;
  }
  while (ds.length < 3) ds.push("以上都不对");
  return shuffle([correct].concat(ds));
}
function quizHTML(id) {
  const u = U[id];
  const p = u.qa[Math.floor(Math.random() * u.qa.length)];
  const opts = makeOpts(id, p[1]);
  return '<div class="qq">' + esc(p[0]) + '</div><div class="opts" data-a="' + escA(p[1]) + '">' +
    opts.map((o, k) => '<button class="opt">' + "ABCD"[k] + ". " + esc(o) + "</button>").join("") +
    '</div><div class="quizfb hidden"></div><div class="skipwrap"><button class="rb0 skipq" style="background:#fdecea;color:#c0392b">😵 不会（看卡，明天再来）</button></div>';
}
function modeBody(id) {
  const u = U[id];
  if (MODE === "quiz" && u.qa && u.qa.length) return quizHTML(id);
  if (MODE === "cloze" && u.cloze) return '<div class="muted" style="margin-bottom:6px">先回忆彩色词，再点空位核对</div>' + clozeHTML(u);
  let extra = "";
  if (MODE === "quiz") extra = '<div class="muted" style="margin-top:8px">本卡没有自动题对，用背诵/遮词模式测</div>';
  if (MODE === "cloze") extra = '<div class="muted" style="margin-top:8px">本卡没有可遮的关键词，用背诵对照</div>';
  return bodyHTML(u) + extra;
}
function flagsHTML(id) {
  const st = S.units[id] || {};
  if (st.grad) return '<span class="badge b-grad">🟢已毕业</span>';
  if (st.weak) return '<span class="badge b-weak">🔴弱卡</span>';
  if (st.intro) return '<span class="badge b-due">🟡在练</span>';
  return '<span class="badge b-new">新</span>';
}
function dueBadge(id) {
  const st = S.units[id];
  if (!st || !st.due) return "";
  const late = DI - st.due;
  return '<span class="badge b-due">' + (late > 0 ? "拖" + late + "天" : "到期") + "</span>";
}
function rowHTML(id, norate, planBadge, plain) {
  const u = U[id];
  let flags = "";
  if (planBadge) flags += '<span class="badge b-plan">D' + PLAN_DAY[id] + "</span>";
  flags += flagsHTML(id);
  return '<div class="row' + (norate ? " norate" : "") + '" data-id="' + id + '">' +
    '<div class="rowhead"><span class="chip">' + u.label + '</span><span class="rtitle">' + esc(u.title) +
    '</span><span class="rflags">' + flags + "</span></div>" +
    '<div class="cardbody">' + (plain ? bodyHTML(u) : modeBody(id)) +
    (MODE === "quiz" ? "" : '<div class="ratebar"><button class="rb0" data-r="0">😵 不会</button><button class="rb1" data-r="1">🤔 模糊</button><button class="rb2" data-r="2">😎 掌握</button></div>') +
    "</div></div>";
}
function queueHTML(el, name, title, ids, badgePlan) {
  const done = Q0[name] - ids.length;
  const pct = Q0[name] ? Math.round(done * 100 / Q0[name]) : 100;
  let h = '<div class="qhead"><b>' + title + '</b><span class="cnt">' + (Q0[name] - ids.length) + "/" + Q0[name] + "</span>" +
    '<span class="pbar"><i style="width:' + pct + '%"></i></span></div>';
  if (!Q0[name]) { el.innerHTML = ""; return; }
  h += ids.map(id => rowHTML(id, false, badgePlan)).join("");
  el.innerHTML = h;
}
function render() {
  const info = document.getElementById("dayinfo");
  info.innerHTML = "<b>第" + ROUND + "轮·D" + DAY + "</b> · " + todayStr().slice(5).replace("-", "/");
  const noteEl = document.getElementById("daynote");
  let nh = "";
  if (NOTES[DAY]) nh += '<div class="daynote">📌 ' + NOTES[DAY] + "</div>";
  if (Q.review.length) nh += '<div class="daynote">🔁 今天有 ' + Q.review.length + " 张到期复测卡，先清它们</div>";
  noteEl.innerHTML = nh;
  queueHTML(document.getElementById("q-review"), "review", "🔁 到期复测", Q.review, false);
  queueHTML(document.getElementById("q-new"), "newq", "📖 今日新卡（主线）", Q.newq, false);
  queueHTML(document.getElementById("q-meet"), "meet", "🏛 会议大观 · 每日切片", Q.meet, false);
  const empty = !Q.review.length && !Q.newq.length && !Q.meet.length;
  const ad = document.getElementById("alldone");
  ad.classList.toggle("hidden", !empty);
  if (empty) {
    const lg = S.log[DI] || { g: 0, m: 0, w: 0 };
    ad.innerHTML = "🎉 今日打卡完成！<br><span style='font-weight:400;font-size:12.5px'>掌握 " + lg.g + " · 模糊 " + lg.m + " · 不会 " + lg.w + "（明天见）</span>";
  }
  document.getElementById("dday").textContent = Math.max(0, Math.ceil((new Date(EXAM + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 864e5));
}

function rate(id, r) {
  const st = stOf(id);
  st.intro = 1; st.seenRound = ROUND; st.times = (st.times || 0) + 1; st.last = r;
  if (r === 2) {
    if ((st.stage || 0) >= 2) { st.grad = 1; st.due = null; st.weak = 0; }
    else { st.stage = (st.stage || 0) + 1; st.due = DI + [1, 3, 7][st.stage - 1]; st.weak = 0; }
  } else if (r === 1) {
    st.stage = Math.max(st.stage || 0, 1); st.due = DI + 1; st.weak = 1; st.grad = 0;
  } else {
    st.stage = 0; st.due = DI + 1; st.weak = 1; st.grad = 0;
  }
  const lg = S.log[DI] || (S.log[DI] = { g: 0, m: 0, w: 0 });
  if (r === 2) lg.g++; else if (r === 1) lg.m++; else lg.w++;
  persist();
  for (const k of ["review", "newq", "meet"]) {
    const q = Q[k], i = q.indexOf(id);
    if (i >= 0) { q.splice(i, 1); if (r === 0) q.push(id); }
  }
  render();
  // keep the rated card's neighbours usable: open next row
  const next = document.querySelector("#tab-today .row:not(.open) .rowhead");
  if (next && r !== 0) next.click();
}

function rateQuiet(id, r) {
  const st = stOf(id);
  st.intro = 1; st.seenRound = ROUND; st.times = (st.times || 0) + 1; st.last = r;
  if (r === 2) {
    if ((st.stage || 0) >= 2) { st.grad = 1; st.due = null; st.weak = 0; }
    else { st.stage = (st.stage || 0) + 1; st.due = DI + [1, 3, 7][st.stage - 1]; st.weak = 0; }
  } else if (r === 1) {
    st.stage = Math.max(st.stage || 0, 1); st.due = DI + 1; st.weak = 1; st.grad = 0;
  } else {
    st.stage = 0; st.due = DI + 1; st.weak = 1; st.grad = 0;
  }
  const lg = S.log[DI] || (S.log[DI] = { g: 0, m: 0, w: 0 });
  if (r === 2) lg.g++; else if (r === 1) lg.m++; else lg.w++;
  persist();
  for (const k of ["review", "newq", "meet"]) {
    const q = Q[k], i = q.indexOf(id);
    if (i >= 0) q.splice(i, 1);
  }
  document.querySelectorAll("#tab-today .qhead").forEach(qh => {
    const cont = qh.parentElement;
    const key = cont.id === "q-review" ? "review" : cont.id === "q-new" ? "newq" : "meet";
    const done = Q0[key] - Q[key].length;
    const pct = Q0[key] ? Math.round(done * 100 / Q0[key]) : 100;
    const cnt = qh.querySelector(".cnt"), pb = qh.querySelector(".pbar i");
    if (cnt) cnt.textContent = done + "/" + Q0[key];
    if (pb) pb.style.width = pct + "%";
  });
  const row = document.querySelector('#tab-today .row[data-id="' + id + '"]');
  if (row) row.querySelector(".rflags").innerHTML = flagsHTML(id);
}
function answerQuiz(opt) {
  const row = opt.closest(".row"), id = row.dataset.id;
  const optsEl = opt.closest(".opts");
  if (optsEl.dataset.done) return;
  optsEl.dataset.done = "1";
  const correct = optsEl.dataset.a;
  const chosen = opt.textContent.slice(3);
  const right = chosen === correct;
  optsEl.querySelectorAll("button").forEach(b => {
    b.disabled = true;
    if (b.textContent.slice(3) === correct) b.classList.add("correct");
  });
  if (!right) opt.classList.add("wrong");
  const fb = row.querySelector(".quizfb");
  fb.innerHTML = (right ? '<span class="good">✅ 答对了 · 已记「掌握」（继续走 1/3/7 链）</span>' : '<span class="bad">❌ 答错 · 已记「模糊」，明天再来。原卡如下：</span>') +
    '<div class="fbcard">' + bodyHTML(U[id]) + "</div>";
  fb.classList.remove("hidden");
  const sk = row.querySelector(".skipwrap");
  if (sk) sk.classList.add("hidden");
  rateQuiet(id, right ? 2 : 1);
}
document.getElementById("tab-today").addEventListener("click", e => {
  const rh = e.target.closest(".rowhead");
  if (rh) { rh.parentElement.classList.toggle("open"); return; }
  const b = e.target.closest("button[data-r]");
  if (b) { rate(b.closest(".row").dataset.id, +b.dataset.r); return; }
  const opt = e.target.closest(".opt");
  if (opt && !opt.disabled) { answerQuiz(opt); return; }
  const sk = e.target.closest(".skipq");
  if (sk) { rate(sk.closest(".row").dataset.id, 0); return; }
  const ra = e.target.closest(".revall");
  if (ra) {
    const cb = ra.closest(".cardbody");
    const blks = [...cb.querySelectorAll(".blk")];
    const allRv = blks.length && blks.every(b => b.classList.contains("rv"));
    blks.forEach(bl => {
      if (allRv) { bl.classList.remove("rv"); bl.textContent = "＿＿＿＿"; bl.style.color = ""; }
      else { bl.classList.add("rv"); bl.textContent = bl.dataset.t; bl.style.color = bl.dataset.c; }
    });
    ra.textContent = allRv ? "👀 全部显示" : "🙈 全部遮上";
    return;
  }
  const blk = e.target.closest(".blk");
  if (blk) {
    if (blk.classList.contains("rv")) {
      blk.classList.remove("rv"); blk.textContent = "＿＿＿＿"; blk.style.color = "";
    } else {
      blk.classList.add("rv"); blk.textContent = blk.dataset.t; blk.style.color = blk.dataset.c;
    }
    const cb = blk.closest(".cardbody");
    const rbtn = cb && cb.querySelector(".revall");
    if (rbtn) {
      const blks = [...cb.querySelectorAll(".blk")];
      rbtn.textContent = blks.length && blks.every(b => b.classList.contains("rv")) ? "🙈 全部遮上" : "👀 全部显示";
    }
  }
});
document.querySelectorAll("#modebar button").forEach(b => {
  b.classList.toggle("on", b.dataset.m === MODE);
  b.addEventListener("click", () => {
    MODE = b.dataset.m;
    localStorage.setItem("zzbs_mode", MODE);
    document.querySelectorAll("#modebar button").forEach(x => x.classList.toggle("on", x.dataset.m === MODE));
    render();
  });
});

// ----- browse -----
let browseBuilt = false;
function buildBrowse(filter) {
  const f = (filter || "").trim().toLowerCase();
  let h = "";
  for (const g of D.GROUPS) {
    const ids = g.ids.filter(id => !f || PLAIN[id].includes(f) || id.includes(f));
    if (!ids.length) continue;
    h += '<div class="grp"><h3>' + esc(g.name) + " · " + ids.length + "</h3>" +
      ids.map(id => rowHTML(id, true, true, true)).join("") + "</div>";
  }
  document.getElementById("browsebody").innerHTML = h || '<div class="muted" style="padding:20px;text-align:center">没有匹配的卡片</div>';
}
document.getElementById("search").addEventListener("input", e => buildBrowse(e.target.value));
document.getElementById("tab-browse").addEventListener("click", e => {
  const rh = e.target.closest(".rowhead");
  if (rh) rh.parentElement.classList.toggle("open");
  const h3 = e.target.closest(".grp>h3");
  if (h3) { const g = h3.parentElement; g.classList.toggle("folded"); g.querySelectorAll(".row").forEach(r => r.classList.toggle("hidden")); }
});

// ----- tabs -----
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  ["today", "browse", "stats"].forEach(t => document.getElementById("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
  if (b.dataset.tab === "browse" && !browseBuilt) { buildBrowse(""); browseBuilt = true; }
  if (b.dataset.tab === "stats") renderStats();
}));

// ----- stats -----
function renderStats() {
  let grad = 0, weak = [], seenR = 0;
  for (const id in S.units) {
    const st = S.units[id];
    if (st.grad) grad++;
    if (st.weak && !st.grad) weak.push(id);
    if (st.seenRound === ROUND) seenR++;
  }
  weak.sort((a, b) => (PLAN_DAY[a] || 99) - (PLAN_DAY[b] || 99));
  let cal = '<div class="cal">';
  for (let i = 0; i < 10; i++) {
    const dd = DI + i;
    const n = Object.values(S.units).filter(st => st.due === dd).length;
    cal += '<div class="d' + (i === 0 ? " today" : "") + '">D' + (((dd - 1) % 10) + 1) + "<b>" + n + "</b>张</div>";
  }
  cal += "</div>";
  let plan = '<table class="plantable"><tr><th>天</th><th>内容</th><th>进度</th></tr>';
  for (let d = 1; d <= 10; d++) {
    const ids = (MAIN[d] || []).concat(MEET[d] || []);
    let done = 0, gd = 0;
    ids.forEach(id => { const st = S.units[id]; if (st && st.intro) done++; if (st && st.grad) gd++; });
    const titles = MAIN[d].slice(0, 99).map(id => U[id].title).join("、");
    const short = titles.length > 46 ? titles.slice(0, 46) + "…" : titles;
    plan += '<tr class="' + (d === DAY ? "today" : "") + '"><td>D' + d + (d === DAY ? " ●" : "") + "</td><td>" + esc(short) +
      (NOTES[d] ? '<div class="note">' + esc(NOTES[d]) + "</div>" : "") +
      "</td><td>" + done + "/" + ids.length + "<br><span class='note'>🟢" + gd + "</span></td></tr>";
  }
  plan += "</table>";
  let streak = 0;
  for (let d = DI; d >= 1; d--) { if (S.log[d]) streak++; else if (d !== DI) break; }
  document.getElementById("statsbody").innerHTML =
    '<div class="statcard"><h3>总体进度</h3><span class="big">' + grad + "</span> / " + TOTAL +
    ' 张已毕业（3 次掌握链完成）<div class="muted" style="margin-top:4px">本轮已过 ' + seenR + " 张 · 连续打卡 " + streak + " 天</div></div>" +
    '<div class="statcard"><h3>🔴 弱卡池（' + weak.length + "）</h3>" +
    (weak.length ? '<div class="wchips">' + weak.map(id => "<span data-jump='" + id + "'>" + U[id].label + " " + esc(U[id].title.slice(0, 12)) + "</span>").join("") + "</div>" : '<span class="muted">暂无弱卡，继续保持</span>') + "</div>" +
    '<div class="statcard"><h3>未来 10 天到期复测</h3>' + cal + "</div>" +
    '<div class="statcard"><h3>10 天排期表</h3>' + plan + "</div>" +
    '<div class="statcard"><h3>设置</h3><div class="btnrow"><button id="rs-anchor">重置开始日期为今天</button><button id="rs-all">清空全部学习数据</button></div><div class="muted" style="margin-top:6px">开始日期=第1轮D1；重置不删除已背进度</div></div>';
  document.getElementById("rs-anchor").onclick = () => { if (confirm("把今天设为第1轮 D1？（保留卡片掌握状态）")) { S.anchor = todayStr(); persist(); location.reload(); } };
  document.getElementById("rs-all").onclick = () => { if (confirm("确定清空全部学习数据？不可恢复")) if (confirm("再次确认：真的清空？")) { localStorage.removeItem("zzbs_v1"); location.reload(); } };
}
document.getElementById("tab-stats").addEventListener("click", e => {
  const w = e.target.closest("[data-jump]");
  if (w) {
    document.querySelector('nav button[data-tab="browse"]').click();
    document.getElementById("search").value = "";
    buildBrowse("");
    browseBuilt = true;
    const row = document.querySelector('.row[data-id="' + w.dataset.jump + '"]');
    if (row) { row.classList.add("open"); row.scrollIntoView({ block: "center" }); }
  }
});

buildQueues();
render();
const QS = location.search;
if (QS.indexOf("tab=browse") >= 0) document.querySelector('nav button[data-tab="browse"]').click();
if (QS.indexOf("tab=stats") >= 0) document.querySelector('nav button[data-tab="stats"]').click();
if (QS.indexOf("demo=quiz") >= 0) { MODE = "quiz"; document.querySelectorAll("#modebar button").forEach(x => x.classList.toggle("on", x.dataset.m === "quiz")); render(); }
if (QS.indexOf("demo=cloze") >= 0) { MODE = "cloze"; document.querySelectorAll("#modebar button").forEach(x => x.classList.toggle("on", x.dataset.m === "cloze")); render(); }
if (QS.indexOf("demo=expand") >= 0 || QS.indexOf("demo=quiz") >= 0 || QS.indexOf("demo=cloze") >= 0) {
  const fh = document.querySelector("#q-new .rowhead, #q-review .rowhead, #q-meet .rowhead");
  if (fh) fh.click();
}
</script>
</body>
</html>
